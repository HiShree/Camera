
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Horizon Film Pro</title>

<style>
:root {
  --bg:#0b0c0e;
  --panel:#1b1d21;
  --line:#33363d;
  --text:#f5f5f5;
  --muted:#a4a8af;
  --accent:#f2c14e;
  --red:#ff4055;
}
* { box-sizing:border-box; }
html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}
button,input,select { font:inherit; }
button {
  background:#292c31;
  color:var(--text);
  border:1px solid var(--line);
  border-radius:8px;
  padding:7px 8px;
  font-size:11px;
  touch-action:manipulation;
}
button:active { transform:scale(.98); }
button:disabled { opacity:.45; }
.active {
  border-color:var(--accent);
  color:var(--accent);
  background:#322c1d;
}
.primary {
  background:var(--accent);
  color:#15120a;
  border-color:var(--accent);
  font-weight:800;
}
.recording {
  background:var(--red);
  border-color:var(--red);
  color:white;
}
.app {
  height:100dvh;
  width:100%;
  max-width:700px;
  margin:auto;
  padding:5px 8px max(5px, env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  gap:5px;
  overflow:hidden;
}
header {
  min-height:32px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.logo {
  font-size:14px;
  font-weight:900;
  letter-spacing:.8px;
}
.logo span { color:var(--accent); }
.subtitle {
  color:var(--muted);
  font-size:8px;
  margin-top:2px;
}
.status {
  color:var(--muted);
  font-size:9px;
  border:1px solid var(--line);
  border-radius:14px;
  padding:5px 7px;
}
#previewBox {
  position:relative;
  width:100%;
  flex:1 1 auto;
  min-height:0;
  background:#000;
  overflow:hidden;
  border:1px solid #292c31;
  border-radius:10px;
}
#cameraVideo { display:none; }
#viewCanvas {
  width:100%;
  height:100%;
  display:block;
  background:#000;
}
.hud {
  position:absolute;
  left:6px;
  right:6px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  pointer-events:none;
}
.hud.top { top:6px; }
.hud.bottom { bottom:6px; }
.chip {
  background:#08090bdc;
  border:1px solid #ffffff20;
  border-radius:5px;
  padding:5px 6px;
  font-size:9px;
}
#gridOverlay {
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(to right,transparent 33.1%,#ffffff45 33.3%,transparent 33.6%,transparent 66.4%,#ffffff45 66.6%,transparent 66.9%),
    linear-gradient(to bottom,transparent 33.1%,#ffffff45 33.3%,transparent 33.6%,transparent 66.4%,#ffffff45 66.6%,transparent 66.9%);
}
.controls {
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  gap:5px;
}
.section-label {
  font-size:8px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:1px;
}
.row { display:flex; align-items:center; gap:5px; }
.row > * { flex:1; min-width:0; }
.zoom-panel {
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--panel);
  border:1px solid #292c31;
  border-radius:8px;
  padding:5px 8px;
}
.zoom-panel label {
  color:var(--muted);
  font-size:10px;
  white-space:nowrap;
}
.zoom-panel input { flex:1; min-width:0; }
#zoomValue {
  color:var(--accent);
  font-size:10px;
  width:30px;
  text-align:right;
}
input[type=range] {
  width:100%;
  height:18px;
  margin:0;
  accent-color:var(--accent);
}
.whitebalance {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
}
.wb-card {
  background:var(--panel);
  border:1px solid #292c31;
  border-radius:8px;
  padding:5px 7px;
  min-width:0;
}
.wb-heading {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:4px;
  margin-bottom:3px;
}
.wb-heading span:first-child {
  font-size:10px;
  color:#e9e9e9;
}
.wb-heading span:last-child {
  color:var(--accent);
  font-size:10px;
  white-space:nowrap;
}
.wb-card input { display:block; }
.presets {
  display:flex;
  gap:4px;
}
.presets button {
  flex:1;
  padding:6px 2px;
  font-size:9px;
}
.bottom-controls {
  display:grid;
  grid-template-columns:1fr 1fr 1.25fr;
  gap:5px;
}
#message {
  font-size:9px;
  color:var(--muted);
  min-height:11px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
@media(max-height:680px) {
  .app { gap:3px; padding-top:3px; }
  header { min-height:27px; }
  .logo { font-size:12px; }
  .controls { gap:3px; }
  .wb-card { padding:3px 6px; }
  .presets button { padding:4px 2px; }
  button { padding:6px 6px; }
}
@media(max-height:570px) {
  .subtitle { display:none; }
  .wb-card input { height:14px; }
  .section-label { display:none; }
}
</style>
</head>

<body>
<div class="app">
  <header>
    <div>
      <div class="logo">HORIZON <span>FILM PRO</span></div>
      <div class="subtitle">MOBILE CINEMA CAMERA</div>
    </div>
    <div class="status" id="cameraStatus">CAMERA OFF</div>
  </header>

  <!-- Large camera preview -->
  <div id="previewBox">
    <video id="cameraVideo" autoplay muted playsinline></video>
    <canvas id="viewCanvas"></canvas>
    <div id="gridOverlay"></div>
    <div class="hud top">
      <span class="chip" id="resolution">NO SIGNAL</span>
      <span class="chip" id="fpsLabel">30 FPS</span>
    </div>
    <div class="hud bottom">
      <span class="chip" id="zoomHud">1.0×</span>
      <span class="chip" id="timer">00:00</span>
    </div>
  </div>

  <div class="controls">
    <div class="row">
      <button id="startBtn" class="primary">Start Camera</button>
      <button id="switchBtn">⇄ Flip</button>
      <button id="gridBtn" class="active">Grid ON</button>
    </div>

    <!-- One zoom slider, no zoom buttons -->
    <div class="zoom-panel">
      <label for="zoomSlider">ZOOM</label>
      <input id="zoomSlider" type="range" min="1" max="3" step="0.05" value="1">
      <span id="zoomValue">1.0×</span>
    </div>

    <div class="section-label">White balance</div>

    <div class="whitebalance">
      <div class="wb-card">
        <div class="wb-heading">
          <span>TEMP</span>
          <span id="tempValue">6400 K</span>
        </div>
        <input id="tempSlider" type="range" min="2500" max="10000" step="100" value="6400">
      </div>
      <div class="wb-card">
        <div class="wb-heading">
          <span>TINT</span>
          <span id="tintValue">0</span>
        </div>
        <input id="tintSlider" type="range" min="-100" max="100" value="0">
      </div>
    </div>

    <div class="presets">
      <button data-temp="3200" data-tint="0">Bulb</button>
      <button data-temp="4500" data-tint="0">Fluorescent</button>
      <button data-temp="5600" data-tint="0">Daylight</button>
      <button data-temp="6500" data-tint="0">Cloudy</button>
      <button id="awbBtn" class="active">AWB</button>
    </div>

    <div class="section-label">Colour look</div>
    <div class="row" id="filterRow">
      <button class="filter active" data-filter="standard">STD</button>
      <button class="filter" data-filter="cinematic">CINE</button>
      <button class="filter" data-filter="vivid">VIVID</button>
      <button class="filter" data-filter="warm">WARM</button>
      <button class="filter" data-filter="bw">B&W</button>
      <button class="filter" data-filter="vintage">RETRO</button>
    </div>

    <div class="bottom-controls">
      <button id="audioBtn" class="active">Mic ON</button>
      <button id="fpsBtn">30 FPS</button>
      <button id="recordBtn" class="primary" disabled>● Record</button>
    </div>
    <div id="message">Start the camera to begin.</div>
  </div>
</div>

<script>
"use strict";

const video = document.getElementById("cameraVideo");
const canvas = document.getElementById("viewCanvas");
const ctx = canvas.getContext("2d", {alpha:false});
const previewBox = document.getElementById("previewBox");

let stream = null;
let outputStream = null;
let recorder = null;
let chunks = [];
let raf = 0;
let timerInterval = null;
let recordStart = 0;
let facingMode = "environment";

let zoom = 1;
let temperature = 6400;
let tint = 0;
let filterName = "standard";
let audioEnabled = true;
let gridEnabled = true;
let fps = 30;
let awb = true;

const $ = id => document.getElementById(id);
const message = text => $("message").textContent = text;

const filterMap = {
  standard: "",
  cinematic: "contrast(1.16) saturate(.82) sepia(.10)",
  vivid: "contrast(1.08) saturate(1.5)",
  warm: "sepia(.22) saturate(1.2)",
  bw: "grayscale(1) contrast(1.1)",
  vintage: "sepia(.42) contrast(.9) saturate(.82)"
};

function resizeCanvas() {
  const r = previewBox.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.round(r.width*dpr));
  canvas.height = Math.max(1, Math.round(r.height*dpr));
}

function waitForVideo() {
  return new Promise((resolve, reject) => {
    if (video.readyState >= 2 && video.videoWidth) return resolve();
    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error("Camera did not produce a video frame."));
    }, 12000);
    const done = () => {
      if (video.videoWidth) {
        cleanup();
        resolve();
      }
    };
    function cleanup() {
      clearTimeout(timeout);
      video.removeEventListener("loadeddata", done);
      video.removeEventListener("resize", done);
    }
    video.addEventListener("loadeddata", done);
    video.addEventListener("resize", done);
  });
}

async function startCamera() {
  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error("Camera access requires HTTPS and a supported browser.");
    }
    if (recorder && recorder.state !== "inactive") {
      message("Stop recording before restarting the camera.");
      return;
    }

    stopTracks();
    message("Opening camera…");

    stream = await navigator.mediaDevices.getUserMedia({
      audio:true,
      video:{
        facingMode:{ideal:facingMode},
        width:{ideal:1920},
        height:{ideal:1080},
        frameRate:{ideal:30}
      }
    });

    video.srcObject = stream;
    await video.play();
    await waitForVideo();

    const settings = stream.getVideoTracks()[0].getSettings();
    $("resolution").textContent =
      (settings.width || video.videoWidth) + "×" +
      (settings.height || video.videoHeight);

    $("cameraStatus").textContent = "CAMERA ON";
    $("startBtn").textContent = "Restart";
    stream.getAudioTracks().forEach(t => t.enabled = audioEnabled);

    resizeCanvas();
    drawLoop();
    $("recordBtn").disabled = false;
    message("Camera ready.");
  } catch (e) {
    message("Camera error: " + e.message);
    $("cameraStatus").textContent = "CAMERA ERROR";
  }
}

function stopTracks() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  video.srcObject = null;
}

async function flipCamera() {
  if (recorder && recorder.state !== "inactive") {
    message("Stop recording before flipping the camera.");
    return;
  }
  facingMode = facingMode === "environment" ? "user" : "environment";
  await startCamera();
}

function drawLoop() {
  cancelAnimationFrame(raf);
  function frame() {
    if (video.readyState >= 2 && video.videoWidth) renderFrame();
    raf = requestAnimationFrame(frame);
  }
  frame();
}

function renderFrame() {
  const W = canvas.width, H = canvas.height;
  if (!W || !H) return;

  // Fill the preview and crop the image as zoom increases.
  const scale = Math.max(W/video.videoWidth, H/video.videoHeight)*zoom;
  const dw = video.videoWidth*scale;
  const dh = video.videoHeight*scale;

  // Approximate colour-temperature adjustment using a warm/cool
  // colour overlay. This does not change the camera sensor's WB.
  const warm = (6500-temperature)/7500;
  const warmth = Math.max(-0.55, Math.min(0.55, warm));
  const tintAmount = tint/250;

  ctx.save();
  ctx.fillStyle = "#000";
  ctx.fillRect(0,0,W,H);

  ctx.filter = filterMap[filterName] || "";
  ctx.drawImage(video,(W-dw)/2,(H-dh)/2,dw,dh);
  ctx.filter = "none";

  if (!awb && Math.abs(warmth) > 0.01) {
    ctx.globalCompositeOperation = "soft-light";
    ctx.fillStyle = warmth > 0
      ? "rgba(255,150,55," + Math.abs(warmth)*0.55 + ")"
      : "rgba(65,140,255," + Math.abs(warmth)*0.55 + ")";
    ctx.fillRect(0,0,W,H);
  }

  if (!awb && Math.abs(tintAmount) > 0.005) {
    ctx.globalCompositeOperation = "soft-light";
    ctx.fillStyle = tintAmount > 0
      ? "rgba(255,45,150," + Math.abs(tintAmount) + ")"
      : "rgba(60,255,100," + Math.abs(tintAmount) + ")";
    ctx.fillRect(0,0,W,H);
  }

  ctx.globalCompositeOperation = "source-over";
  ctx.restore();

  $("zoomHud").textContent = zoom.toFixed(1)+"×";
}

$("startBtn").addEventListener("click",startCamera);
$("switchBtn").addEventListener("click",flipCamera);

$("zoomSlider").addEventListener("input",e => {
  zoom = Number(e.target.value);
  $("zoomValue").textContent = zoom.toFixed(1)+"×";
});

$("tempSlider").addEventListener("input",e => {
  temperature = Number(e.target.value);
  awb = false;
  $("tempValue").textContent = temperature+" K";
  $("awbBtn").classList.remove("active");
});

$("tintSlider").addEventListener("input",e => {
  tint = Number(e.target.value);
  awb = false;
  $("tintValue").textContent = tint;
  $("awbBtn").classList.remove("active");
});

document.querySelectorAll("[data-temp]").forEach(btn => {
  btn.addEventListener("click",() => {
    temperature = Number(btn.dataset.temp);
    tint = Number(btn.dataset.tint);
    awb = false;
    $("tempSlider").value = temperature;
    $("tintSlider").value = tint;
    $("tempValue").textContent = temperature+" K";
    $("tintValue").textContent = tint;
    $("awbBtn").classList.remove("active");
  });
});

$("awbBtn").addEventListener("click",() => {
  awb = true;
  temperature = 6400;
  tint = 0;
  $("tempSlider").value = temperature;
  $("tintSlider").value = tint;
  $("tempValue").textContent = temperature+" K";
  $("tintValue").textContent = "0";
  $("awbBtn").classList.add("active");
  message("Automatic colour rendering selected.");
});

document.querySelectorAll(".filter").forEach(btn => {
  btn.addEventListener("click",() => {
    filterName = btn.dataset.filter;
    document.querySelectorAll(".filter").forEach(b =>
      b.classList.toggle("active",b===btn)
    );
  });
});

$("gridBtn").addEventListener("click",() => {
  gridEnabled = !gridEnabled;
  $("gridOverlay").style.display = gridEnabled ? "block" : "none";
  $("gridBtn").textContent = gridEnabled ? "Grid ON" : "Grid OFF";
  $("gridBtn").classList.toggle("active",gridEnabled);
});

$("audioBtn").addEventListener("click",() => {
  audioEnabled = !audioEnabled;
  if (stream) stream.getAudioTracks().forEach(t => t.enabled = audioEnabled);
  $("audioBtn").textContent = audioEnabled ? "Mic ON" : "Mic OFF";
  $("audioBtn").classList.toggle("active",audioEnabled);
});

$("fpsBtn").addEventListener("click",() => {
  fps = fps === 30 ? 24 : fps === 24 ? 25 : fps === 25 ? 60 : 30;
  $("fpsBtn").textContent = fps+" FPS";
  $("fpsLabel").textContent = fps+" FPS";
});

function supportedMime() {
  if (!window.MediaRecorder) return "";
  const types = [
    "video/webm;codecs=vp9,opus",
    "video/webm;codecs=vp8,opus",
    "video/webm"
  ];
  return types.find(t => MediaRecorder.isTypeSupported(t)) || "";
}

function startRecording() {
  if (!stream) {
    message("Start the camera first.");
    return;
  }
  if (!canvas.captureStream || !window.MediaRecorder) {
    message("Canvas recording is not supported by this browser.");
    return;
  }

  try {
    chunks = [];
    outputStream = canvas.captureStream(fps);

    if (audioEnabled) {
      stream.getAudioTracks().forEach(t => {
        if (t.readyState === "live") outputStream.addTrack(t);
      });
    }

    const mime = supportedMime();
    recorder = new MediaRecorder(outputStream,mime ? {mimeType:mime} : undefined);

    recorder.ondataavailable = e => {
      if (e.data && e.data.size) chunks.push(e.data);
    };
    recorder.onerror = () => message("Recording error.");
    recorder.onstop = saveRecording;
    recorder.start(250);

    recordStart = Date.now();
    $("timer").textContent = "00:00";
    timerInterval = setInterval(() => {
      const s = Math.floor((Date.now()-recordStart)/1000);
      $("timer").textContent =
        String(Math.floor(s/60)).padStart(2,"0")+":"+
        String(s%60).padStart(2,"0");
    },250);

    $("recordBtn").disabled = true;
    $("recordBtn").classList.add("recording");
    $("recordBtn").textContent = "● REC";
    message("Recording…");
  } catch(e) {
    message("Cannot record: "+e.message);
    cleanupOutput();
  }
}

function stopRecording() {
  if (recorder && recorder.state !== "inactive") recorder.stop();
  clearInterval(timerInterval);
  $("recordBtn").disabled = !stream;
  $("recordBtn").classList.remove("recording");
  $("recordBtn").textContent = "● Record";
}

function saveRecording() {
  if (!chunks.length) {
    message("No video data recorded.");
    cleanupOutput();
    return;
  }

  const blob = new Blob(chunks,{type:recorder.mimeType || "video/webm"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "horizon-film-"+Date.now()+".webm";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url),60000);
  message("Video saved to Downloads.");
  cleanupOutput();
}

function cleanupOutput() {
  if (outputStream) {
    outputStream.getTracks().forEach(t => t.stop());
    outputStream = null;
  }
}

$("recordBtn").addEventListener("click",startRecording);
$("recordBtn").insertAdjacentHTML("afterend",
  '<button id="stopBtn" disabled>Stop</button>');
$("stopBtn").addEventListener("click",stopRecording);

// Keep both recording controls on the same bottom row.
const stopBtn = $("stopBtn");
stopBtn.style.display = "none";
$("recordBtn").addEventListener("click",() => {
  if (recorder && recorder.state === "recording") stopBtn.style.display = "inline-block";
});
stopBtn.addEventListener("click",() => stopBtn.style.display = "none");

window.addEventListener("resize",resizeCanvas);
window.addEventListener("orientationchange",() => setTimeout(resizeCanvas,250));

window.addEventListener("beforeunload",() => {
  cancelAnimationFrame(raf);
  clearInterval(timerInterval);
  stopTracks();
  cleanupOutput();
});

resizeCanvas();
</script>
</body>
</html>
