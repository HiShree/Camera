<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Pro Mobile Camera</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
        }
        /* Viewfinder Container */
        .viewfinder {
            position: relative;
            flex: 1;
            width: 100%;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Top Toolbar & HUD */
        .top-toolbar {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 5;
            pointer-events: auto;
        }
        .tool-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
        .zoom-cluster {
            display: flex;
            gap: 6px;
        }
        .zoom-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        .zoom-btn.active {
            background: #ff4757;
            border-color: #ff4757;
        }
        /* Style Selector Bar */
        .filter-bar {
            height: 55px;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 15px;
            overflow-x: auto;
            flex-shrink: 0;
        }
        .filter-chip {
            padding: 6px 14px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }
        .filter-chip.active {
            background: #ff4757;
            border-color: #ff4757;
            font-weight: bold;
        }
        /* Shutter Controls */
        .controls {
            height: 100px;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }
        .shutter-btn {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: #fff;
            border: 4px solid #666;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
            transition: transform 0.1s;
        }
        .shutter-btn:active {
            transform: scale(0.92);
        }
        /* Preview Modal */
        .preview-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 20;
        }
        .preview-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .preview-container img {
            max-width: 100%;
            max-height: 65vh;
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }
        .actions {
            display: flex;
            gap: 12px;
        }
        .btn {
            flex: 1;
            padding: 14px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .btn-secondary {
            background: #333;
        }
    </style>
</head>
<body>

    <!-- Camera Viewfinder -->
    <div class="viewfinder" id="viewfinder">
        <video id="cameraStream" autoplay playsinline></video>
        
        <!-- Top Tool Bar (Flip Camera & Zoom) -->
        <div class="top-toolbar">
            <button class="tool-btn" id="flipCamBtn">🔄 Flip</button>
            <div class="zoom-cluster">
                <button class="zoom-btn active" data-zoom="1">1x</button>
                <button class="zoom-btn" data-zoom="2">2x</button>
                <button class="zoom-btn" data-zoom="3">3x</button>
            </div>
        </div>
    </div>

    <!-- AI Situational Style Bar -->
    <div class="filter-bar" id="filterBar">
        <button class="filter-chip active" data-mode="auto_match">✨ AI Auto-Match Scene</button>
        <button class="filter-chip" data-mode="forest_path">🌲 Forest Canopy & Path</button>
        <button class="filter-chip" data-mode="street_vehicle">🚙 Moody Vehicle / Street</button>
    </div>

    <!-- Shutter Controls -->
    <div class="controls">
        <button class="shutter-btn" id="captureBtn"></button>
    </div>

    <canvas id="photoCanvas" style="display:none;"></canvas>

    <!-- Preview Modal -->
    <div class="preview-modal" id="previewModal">
        <h3 style="color: #ff4757; text-align: center; margin-top: 10px;">✨ AI Situational Enhancement Ready</h3>
        
        <div class="preview-container">
            <img id="resultImage" alt="Enhanced Output">
        </div>

        <div class="actions">
            <button class="btn btn-secondary" id="retakeBtn">Retake</button>
            <button class="btn" id="downloadBtn">Download Photo</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('cameraStream');
        const captureBtn = document.getElementById('captureBtn');
        const canvas = document.getElementById('photoCanvas');
        const ctx = canvas.getContext('2d');
        
        const previewModal = document.getElementById('previewModal');
        const resultImage = document.getElementById('resultImage');
        const retakeBtn = document.getElementById('retakeBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        
        const flipCamBtn = document.getElementById('flipCamBtn');
        const zoomBtns = document.querySelectorAll('.zoom-btn');
        const modeChips = document.querySelectorAll('.filter-chip');

        let currentFacingMode = 'environment';
        let currentZoom = 1;
        let selectedMode = 'auto_match';
        let currentStream = null;
        let finalDataUrl = '';

        // Initialize Camera Stream
        async function initCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            try {
                const constraints = {
                    video: {
                        facingMode: currentFacingMode,
                        width: { ideal: 3840 },
                        height: { ideal: 2160 }
                    },
                    audio: false
                };

                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
            } catch (err) {
                alert("Camera error: " + err.message);
            }
        }
        initCamera();

        // Flip Camera
        flipCamBtn.addEventListener('click', () => {
            currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
            initCamera();
        });

        // Zoom Control
        zoomBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                zoomBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentZoom = parseFloat(e.target.getAttribute('data-zoom'));
                video.style.transform = `scale(${currentZoom})`;
            });
        });

        // Mode Selector
        modeChips.forEach(chip => {
            chip.addEventListener('click', (e) => {
                modeChips.forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                selectedMode = e.target.getAttribute('data-mode');
            });
        });

        // Capture & Situational AI Processing Engine
        captureBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth || 1920;
            canvas.height = video.videoHeight || 1080;
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let data = imgData.data;

            let centerX = canvas.width / 2;
            let centerY = canvas.height / 2;
            let maxDist = Math.sqrt(centerX * centerX + centerY * centerY);

            // Determine profile
            let mode = selectedMode;
            if (mode === 'auto_match') {
                // Intelligent default situational profile matching the reference aesthetic
                mode = 'forest_path'; 
            }

            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    let i = (y * canvas.width + x) * 4;
                    let r = data[i], g = data[i+1], b = data[i+2];

                    let lum = 0.299 * r + 0.587 * g + 0.114 * b;

                    if (mode === 'forest_path') {
                        if (lum > 150) { r *= 1.15; g *= 1.2; b *= 1.05; }
                        else if (lum < 90) { r *= 0.8; g *= 0.85; b *= 0.8; }
                        r = ((r / 255 - 0.5) * 1.25 + 0.5) * 255;
                        g = ((g / 255 - 0.5) * 1.25 + 0.5) * 255;
                        b = ((b / 255 - 0.5) * 1.25 + 0.5) * 255;
                    } 
                    else if (mode === 'street_vehicle') {
                        r = ((r / 255 - 0.5) * 1.4 + 0.5) * 255;
                        g = ((g / 255 - 0.5) * 1.4 + 0.5) * 255;
                        b = ((b / 255 - 0.5) * 1.4 + 0.5) * 255;

                        let distance = Math.sqrt(Math.pow(x - centerX, 2) + Math.pow(y - centerY, 2));
                        let vignette = Math.max(0.3, 1 - (distance / maxDist) * 0.65);
                        r *= vignette; g *= vignette; b *= vignette;
                    }

                    data[i]   = Math.min(255, Math.max(0, r));
                    data[i+1] = Math.min(255, Math.max(0, g));
                    data[i+2] = Math.min(255, Math.max(0, b));
                }
            }

            ctx.putImageData(imgData, 0, 0);

            // Watermark stamp matching reference style
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, canvas.height - 120, canvas.width, 120);
            ctx.fillStyle = "#111111";
            ctx.font = `bold ${Math.max(18, canvas.width / 42)}px sans-serif`;
            ctx.fillText("ASUS_I003DD", 50, canvas.height - 60);
            ctx.font = `${Math.max(15, canvas.width / 50)}px sans-serif`;
            ctx.fillText("5mm f/1.8  1/320 ISO25", canvas.width - 430, canvas.height - 60);

            finalDataUrl = canvas.toDataURL('image/jpeg', 0.95);
            resultImage.src = finalDataUrl;
            previewModal.style.display = 'flex';
        });

        retakeBtn.addEventListener('click', () => {
            previewModal.style.display = 'none';
        });

        downloadBtn.addEventListener('click', () => {
            const a = document.createElement('a');
            a.href = finalDataUrl;
            a.download = `AI_Situational_Camera_${Date.now()}.jpg`;
            a.click();
        });
    </script>
</body>
</html>
