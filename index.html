<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Horizon Camera Web</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Viewfinder container that acts as the leveling window */
        .viewport {
            position: relative;
            flex: 1;
            width: 100%;
            overflow: hidden;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Scaled wrapper so the video doesn't show black edges when rotating */
        #rotator {
            position: absolute;
            width: 150%;
            height: 150%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.05s linear;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* HUD Overlay styling */
        .hud {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            letter-spacing: 1px;
            z-index: 10;
            pointer-events: none;
        }

        .controls {
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 10;
        }

        .btn {
            background: #ffffff;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
        }

        .btn-primary {
            background: #e11d48;
            color: white;
        }
    </style>
</head>
<body>

    <div class="viewport">
        <div class="hud" id="hudText">LEVEL: 0°</div>
        <div id="rotator">
            <video id="cameraStream" autoplay playsinline muted></video>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-primary" id="startBtn">Start Camera</button>
        <button class="btn" id="permissionBtn" style="display:none;">Enable Gyro</button>
    </div>

    <script>
        const video = document.getElementById('cameraStream');
        const rotator = document.getElementById('rotator');
        const hudText = document.getElementById('hudText');
        const startBtn = document.getElementById('startBtn');
        const permissionBtn = document.getElementById('permissionBtn');

        // Start back camera stream
        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } },
                    audio: false
                }).catch(() => {
                    // Fallback to any available camera if environment camera fails
                    return navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                });

                video.srcObject = stream;
                startBtn.style.display = 'none';

                // Handle iOS 13+ motion permission requirements
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    permissionBtn.style.display = 'inline-block';
                } else {
                    startOrientationTracking();
                }
            } catch (err) {
                alert('Could not access camera. Please ensure permissions are allowed.');
            }
        });

        permissionBtn.addEventListener('click', async () => {
            const permissionState = await DeviceOrientationEvent.requestPermission();
            if (permissionState === 'granted') {
                permissionBtn.style.display = 'none';
                startOrientationTracking();
            } else {
                alert('Gyroscope permission is required for horizon leveling.');
            }
        });

        function startOrientationTracking() {
            window.addEventListener('deviceorientation', (event) => {
                // Gamma represents left-to-right tilt (roll) in degrees (-90 to 90)
                let tilt = event.gamma || 0;

                // Limit extreme tilt values to prevent UI breaking
                if (tilt > 50) tilt = 50;
                if (tilt < -50) tilt = -50;

                // Counter-rotate the video feed to keep the horizon flat
                rotator.style.transform = `rotate(${-tilt}deg)`;
                hudText.innerText = `LEVEL: ${Math.round(tilt)}°`;
            });
        }
    </script>
</body>
</html>
