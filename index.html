<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Enhance 4K Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* Viewfinder Container */
        .viewfinder {
            position: relative;
            flex: 1;
            width: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* HUD & Framing Overlay */
        .hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .top-hud {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            background: rgba(0,0,0,0.5);
            padding: 6px 14px;
            border-radius: 20px;
            align-self: center;
            letter-spacing: 1px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .focus-reticle {
            width: 160px;
            height: 160px;
            border: 1px dashed rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        /* Style Selector Bar */
        .filter-bar {
            height: 55px;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 15px;
            overflow-x: auto;
        }
        .filter-chip {
            padding: 6px 14px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }
        .filter-chip.active {
            background: #ff4757;
            border-color: #ff4757;
            font-weight: bold;
        }
        /* Bottom Controls */
        .controls {
            height: 110px;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .shutter-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #fff;
            border: 4px solid #666;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
            transition: transform 0.1s;
        }
        .shutter-btn:active {
            transform: scale(0.92);
        }
        /* Preview Modal */
        .preview-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 10;
        }
        .preview-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .preview-container img {
            max-width: 100%;
            max-height: 65vh;
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }
        .actions {
            display: flex;
            gap: 12px;
        }
        .btn {
            flex: 1;
            padding: 14px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .btn-secondary {
            background: #333;
        }
    </style>
</head>
<body>

    <!-- Camera Viewfinder -->
    <div class="viewfinder">
        <video id="cameraStream" autoplay playsinline></video>
        <div class="hud-overlay">
            <div class="top-hud">
                <span>⚡ AUTO SHADOW BOOST • 4K</span>
            </div>
            <div class="focus-reticle"></div>
        </div>
    </div>

    <!-- Auto Style Selector -->
    <div class="filter-bar" id="filterBar">
        <button class="filter-chip active" data-style="cinematic_pop">Cinematic Pop</button>
        <button class="filter-chip" data-style="hdr_bright">HDR Shadow Lift</button>
        <button class="filter-chip" data-style="moody_teal">Moody Teal & Orange</button>
        <button class="filter-chip" data-style="natural">Natural Clear</button>
    </div>

    <!-- Shutter Controls -->
    <div class="controls">
        <button class="shutter-btn" id="captureBtn"></button>
    </div>

    <canvas id="photoCanvas" style="display:none;"></canvas>

    <!-- Post-Capture Screen -->
    <div class="preview-modal" id="previewModal">
        <h3 style="color: #ff4757; text-align: center; margin-top: 10px;">✨ AI Auto-Enhanced Output</h3>
        
        <div class="preview-container">
            <img id="resultImage" alt="Auto Enhanced Output">
        </div>

        <div class="actions">
            <button class="btn btn-secondary" id="retakeBtn">Retake</button>
            <button class="btn" id="downloadBtn">Download 4K Photo</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('cameraStream');
        const captureBtn = document.getElementById('captureBtn');
        const canvas = document.getElementById('photoCanvas');
        const ctx = canvas.getContext('2d');
        
        const previewModal = document.getElementById('previewModal');
        const resultImage = document.getElementById('resultImage');
        const retakeBtn = document.getElementById('retakeBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const styleChips = document.querySelectorAll('.filter-chip');

        let selectedStyle = 'cinematic_pop';
        let finalDataUrl = '';

        // Initialize Camera
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 3840 }, height: { ideal: 2160 } },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                alert("Camera permission denied or unavailable: " + err.message);
            }
        }
        initCamera();

        // Style selector logic
        styleChips.forEach(chip => {
            chip.addEventListener('click', (e) => {
                styleChips.forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                selectedStyle = e.target.getAttribute('data-style');
            });
        });

        // Capture & Automatic Shadow/Highlight Enhancement Pipeline
        captureBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth || 1920;
            canvas.height = video.videoHeight || 1080;
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let data = imgData.data;

            // Step 1: Analyze luminance to target and lift shadows automatically
            for (let i = 0; i < data.length; i += 4) {
                let r = data[i], g = data[i+1], b = data[i+2];

                // Calculate pixel brightness (Luminance)
                let lum = 0.299 * r + 0.587 * g + 0.114 * b;

                // Automatic Shadow Lifting Curve: Boost dark pixels more than bright pixels
                if (lum < 100) {
                    let shadowBoost = 1.35; // Lifts dark/shadow areas
                    r = Math.min(255, r * shadowBoost);
                    g = Math.min(255, g * shadowBoost);
                    b = Math.min(255, b * shadowBoost);
                }

                // Step 2: Apply Selected Style Adjustments
                if (selectedStyle === 'cinematic_pop') {
                    // Enhance contrast and warm up mid-tones slightly
                    r = ((r / 255 - 0.5) * 1.2 + 0.5) * 255;
                    g = ((g / 255 - 0.5) * 1.2 + 0.5) * 255;
                    b = ((b / 255 - 0.5) * 1.2 + 0.5) * 255;
                    r *= 1.05; b *= 0.95;
                } 
                else if (selectedStyle === 'hdr_bright') {
                    // Aggressive shadow recovery and highlight balance
                    r = Math.min(255, r * 1.12);
                    g = Math.min(255, g * 1.12);
                    b = Math.min(255, b * 1.12);
                } 
                else if (selectedStyle === 'moody_teal') {
                    // Professional cinematic teal-orange color grade
                    r *= 1.1; 
                    b *= 1.2;
                }

                data[i]   = Math.min(255, Math.max(0, r));
                data[i+1] = Math.min(255, Math.max(0, g));
                data[i+2] = Math.min(255, Math.max(0, b));
            }

            ctx.putImageData(imgData, 0, 0);

            // Step 3: Burn Professional Watermark Stamp on Bottom
            ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
            ctx.fillRect(0, canvas.height - 90, canvas.width, 90);

            ctx.fillStyle = "#ffffff";
            ctx.font = `bold ${Math.max(16, canvas.width / 45)}px sans-serif`;
            ctx.fillText("AI ULTRA SHADOW ENGINE  •  4K HDR", 40, canvas.height - 40);
            
            ctx.fillStyle = "#ff4757";
            ctx.fillText("PRO ENHANCED", canvas.width - 240, canvas.height - 40);

            // Display result
            finalDataUrl = canvas.toDataURL('image/jpeg', 0.95);
            resultImage.src = finalDataUrl;
            previewModal.style.display = 'flex';
        });

        retakeBtn.addEventListener('click', () => {
            previewModal.style.display = 'none';
        });

        downloadBtn.addEventListener('click', () => {
            const a = document.createElement('a');
            a.href = finalDataUrl;
            a.download = `Auto_Enhanced_4K_${Date.now()}.jpg`;
            a.click();
        });
    </script>
</body>
</html>
