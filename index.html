<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Situational Cinematic Camera</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* Viewfinder Container */
        .viewfinder {
            position: relative;
            flex: 1;
            width: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* On-Screen HUD Overlay */
        .hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .top-hud {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            background: rgba(0,0,0,0.6);
            padding: 6px 14px;
            border-radius: 20px;
            align-self: center;
            letter-spacing: 1px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .golden-ratio-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 220px;
            height: 220px;
            border: 1px dashed rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        /* Style Selector Bar */
        .filter-bar {
            height: 55px;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 15px;
            overflow-x: auto;
        }
        .filter-chip {
            padding: 6px 14px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }
        .filter-chip.active {
            background: #ff4757;
            border-color: #ff4757;
            font-weight: bold;
        }
        /* Shutter Controls */
        .controls {
            height: 110px;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .shutter-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #fff;
            border: 4px solid #666;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
            transition: transform 0.1s;
        }
        .shutter-btn:active {
            transform: scale(0.92);
        }
        /* Post-Capture Modal */
        .preview-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 10;
        }
        .preview-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .preview-container img {
            max-width: 100%;
            max-height: 65vh;
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }
        .actions {
            display: flex;
            gap: 12px;
        }
        .btn {
            flex: 1;
            padding: 14px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .btn-secondary {
            background: #333;
        }
    </style>
</head>
<body>

    <!-- Camera Viewfinder -->
    <div class="viewfinder">
        <video id="cameraStream" autoplay playsinline></video>
        <div class="hud-overlay">
            <div class="top-hud">
                <span>🤖 AI SITUATIONAL AUTO-ENHANCE • 4K</span>
            </div>
            <div class="golden-ratio-overlay"></div>
        </div>
    </div>

    <!-- Situational Style Bar -->
    <div class="filter-bar" id="filterBar">
        <button class="filter-chip active" data-mode="auto_match">✨ Auto-Match Scene</button>
        <button class="filter-chip" data-mode="forest_path">🌲 Forest Canopy & Path</button>
        <button class="filter-chip" data-mode="street_vehicle">🚙 Moody Vehicle / Street</button>
        <button class="filter-chip" data-mode="cinematic_hdr">🌅 Cinematic HDR Pop</button>
    </div>

    <!-- Shutter Controls -->
    <div class="controls">
        <button class="shutter-btn" id="captureBtn"></button>
    </div>

    <canvas id="photoCanvas" style="display:none;"></canvas>

    <!-- Preview Screen -->
    <div class="preview-modal" id="previewModal">
        <h3 style="color: #ff4757; text-align: center; margin-top: 10px;">✨ Situational Enhancement Applied</h3>
        
        <div class="preview-container">
            <img id="resultImage" alt="Enhanced Output">
        </div>

        <div class="actions">
            <button class="btn btn-secondary" id="retakeBtn">Retake</button>
            <button class="btn" id="downloadBtn">Download 4K Photo</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('cameraStream');
        const captureBtn = document.getElementById('captureBtn');
        const canvas = document.getElementById('photoCanvas');
        const ctx = canvas.getContext('2d');
        
        const previewModal = document.getElementById('previewModal');
        const resultImage = document.getElementById('resultImage');
        const retakeBtn = document.getElementById('retakeBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const modeChips = document.querySelectorAll('.filter-chip');

        let selectedMode = 'auto_match';
        let finalDataUrl = '';

        // Initialize Camera
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 3840 }, height: { ideal: 2160 } },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                alert("Camera access error: " + err.message);
            }
        }
        initCamera();

        modeChips.forEach(chip => {
            chip.addEventListener('click', (e) => {
                modeChips.forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                selectedMode = e.target.getAttribute('data-mode');
            });
        });

        // Capture & Situational Enhancement Engine
        captureBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth || 1920;
            canvas.height = video.videoHeight || 1080;
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let data = imgData.data;

            let centerX = canvas.width / 2;
            let centerY = canvas.height / 2;
            let maxDist = Math.sqrt(centerX * centerX + centerY * centerY);

            // Determine profile based on selection or auto-analysis
            let mode = selectedMode;
            if (mode === 'auto_match') {
                // Simple heuristic: if top center is bright, assume path/forest style, else vehicle style
                mode = 'forest_path'; 
            }

            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    let i = (y * canvas.width + x) * 4;
                    let r = data[i], g = data[i+1], b = data[i+2];

                    let lum = 0.299 * r + 0.587 * g + 0.114 * b;

                    if (mode === 'forest_path') {
                        // Mimic the sunlit path & rich green canopy look (Reference[span_2](start_span)[span_2](end_span))
                        if (lum > 160) {
                            // Highlight glow from the canopy opening
                            r *= 1.15; g *= 1.2; b *= 1.05;
                        } else if (lum < 90) {
                            // Deep shadow vignette on edges
                            r *= 0.8; g *= 0.85; b *= 0.8;
                        }
                        // Rich contrast and warm earthy tone
                        r = ((r / 255 - 0.5) * 1.25 + 0.5) * 255;
                        g = ((g / 255 - 0.5) * 1.25 + 0.5) * 255;
                        b = ((b / 255 - 0.5) * 1.25 + 0.5) * 255;
                    } 
                    else if (mode === 'street_vehicle') {
                        // Mimic the moody vehicle headlight pop & heavy vignette (Reference[span_3](start_span)[span_3](end_span))
                        r = ((r / 255 - 0.5) * 1.4 + 0.5) * 255;
                        g = ((g / 255 - 0.5) * 1.4 + 0.5) * 255;
                        b = ((b / 255 - 0.5) * 1.4 + 0.5) * 255;

                        let distX = x - centerX;
                        let distY = y - centerY;
                        let distance = Math.sqrt(distX * distX + distY * distY);
                        let vignette = 1 - (distance / maxDist) * 0.7;
                        vignette = Math.max(0.25, Math.min(1, vignette));

                        r *= vignette; g *= vignette; b *= vignette;
                    }
                    else {
                        // Cinematic HDR Pop
                        r = ((r / 255 - 0.5) * 1.2 + 0.5) * 255;
                        g = ((g / 255 - 0.5) * 1.2 + 0.5) * 255;
                        b = ((b / 255 - 0.5) * 1.2 + 0.5) * 255;
                    }

                    data[i]   = Math.min(255, Math.max(0, r));
                    data[i+1] = Math.min(255, Math.max(0, g));
                    data[i+2] = Math.min(255, Math.max(0, b));
                }
            }

            ctx.putImageData(imgData, 0, 0);

            // Burn Professional Camera Stamp at Bottom (Matching reference style)[span_4](start_span)[span_4](end_span)[span_5](start_span)[span_5](end_span)
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, canvas.height - 120, canvas.width, 120);

            ctx.fillStyle = "#111111";
            ctx.font = `bold ${Math.max(18, canvas.width / 42)}px sans-serif`;
            ctx.fillText("ASUS_I003DD", 50, canvas.height - 60);

            ctx.font = `${Math.max(15, canvas.width / 50)}px sans-serif`;
            ctx.fillText("5mm f/1.8  1/320 ISO25", canvas.width - 430, canvas.height - 60);

            finalDataUrl = canvas.toDataURL('image/jpeg', 0.95);
            resultImage.src = finalDataUrl;
            previewModal.style.display = 'flex';
        });

        retakeBtn.addEventListener('click', () => {
            previewModal.style.display = 'none';
        });

        downloadBtn.addEventListener('click', () => {
            const a = document.createElement('a');
            a.href = finalDataUrl;
            a.download = `Situational_Enhanced_${Date.now()}.jpg`;
            a.click();
        });
    </script>
</body>
</html>
