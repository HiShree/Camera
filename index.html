<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>Horizon Camera VNext</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05070b;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#app{
    position:relative;
    width:100%;
    height:100%;
    max-width:540px;
    overflow:hidden;
    background:#000;
}

/* CAMERA */

#camera{
    display:none;
}

#outputCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    background:#000;
}

/* TOP BAR */

.topBar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:10;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:
        calc(env(safe-area-inset-top) + 14px)
        16px
        12px;

    background:linear-gradient(
        to bottom,
        rgba(0,0,0,.72),
        rgba(0,0,0,0)
    );
}

.logo{
    color:white;
    font-size:18px;
    font-weight:800;
    letter-spacing:.5px;
}

.status{
    padding:7px 11px;
    border-radius:20px;

    color:#fff;
    background:rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,.15);

    font-size:11px;
    font-weight:700;
    backdrop-filter:blur(10px);
}

.status.ready{
    color:#7dffae;
}

.status.error{
    color:#ff7777;
}

/* HORIZON INDICATOR */

.horizonIndicator{
    position:absolute;
    top:50%;
    left:50%;

    width:150px;
    height:2px;

    transform:translate(-50%,-50%);

    background:rgba(255,255,255,.8);
    box-shadow:
        0 0 8px rgba(255,255,255,.4);

    opacity:.5;
    pointer-events:none;
}

.horizonIndicator::before,
.horizonIndicator::after{
    content:"";
    position:absolute;
    top:50%;
    width:2px;
    height:12px;
    transform:translateY(-50%);
    background:white;
}

.horizonIndicator::before{
    left:0;
}

.horizonIndicator::after{
    right:0;
}

/* ANGLE */

.angleBadge{
    position:absolute;
    top:calc(env(safe-area-inset-top) + 70px);
    left:50%;
    transform:translateX(-50%);

    z-index:9;

    padding:6px 10px;
    border-radius:14px;

    background:rgba(0,0,0,.42);
    color:white;

    font-size:11px;
    font-weight:700;

    backdrop-filter:blur(8px);
}

/* ZOOM */

.zoomBar{
    position:absolute;
    left:50%;
    bottom:128px;

    transform:translateX(-50%);

    z-index:20;

    display:flex;
    gap:7px;

    padding:7px;

    border-radius:30px;

    background:rgba(0,0,0,.48);
    border:1px solid rgba(255,255,255,.14);

    backdrop-filter:blur(14px);
}

.zoomButton{
    width:48px;
    height:36px;

    border:0;
    border-radius:20px;

    background:transparent;
    color:white;

    font-size:13px;
    font-weight:800;
}

.zoomButton.active{
    background:white;
    color:#111;
}

/* BOTTOM */

.bottomControls{
    position:absolute;
    left:0;
    right:0;
    bottom:0;

    z-index:20;

    padding:
        12px
        18px
        calc(env(safe-area-inset-bottom) + 18px);

    background:linear-gradient(
        to top,
        rgba(0,0,0,.85),
        rgba(0,0,0,0)
    );
}

.controlRow{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.sideControls{
    display:flex;
    gap:10px;
    width:90px;
}

.sideControls.right{
    justify-content:flex-end;
}

.circleButton{
    width:48px;
    height:48px;

    border-radius:50%;
    border:1px solid rgba(255,255,255,.18);

    background:rgba(0,0,0,.5);
    color:white;

    font-size:18px;

    backdrop-filter:blur(10px);
}

.recordButton{
    width:74px;
    height:74px;

    border-radius:50%;

    background:white;

    border:7px solid rgba(255,255,255,.35);

    box-shadow:
        0 0 0 2px rgba(255,255,255,.5);
}

.recordButton.recording{
    background:#ff3344;
}

/* MODE */

.modeBar{
    position:absolute;

    left:50%;
    bottom:215px;

    transform:translateX(-50%);

    z-index:20;

    display:flex;

    padding:5px;

    border-radius:25px;

    background:rgba(0,0,0,.45);
    backdrop-filter:blur(12px);
}

.modeButton{
    border:0;
    background:transparent;

    color:rgba(255,255,255,.65);

    padding:7px 12px;

    border-radius:18px;

    font-size:11px;
    font-weight:800;
}

.modeButton.active{
    background:rgba(255,255,255,.18);
    color:white;
}

/* START SCREEN */

#startScreen{
    position:absolute;
    inset:0;

    z-index:50;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    padding:30px;

    background:
        radial-gradient(
            circle at 50% 30%,
            #18243c,
            #05070b 65%
        );

    color:white;

    text-align:center;
}

#startScreen h1{
    margin:0 0 8px;
    font-size:32px;
}

#startScreen p{
    margin:0 0 25px;
    color:#aeb7c8;
    font-size:14px;
    line-height:1.5;
}

.startButton{
    width:230px;
    padding:15px;

    border:0;
    border-radius:30px;

    background:white;
    color:#111;

    font-size:15px;
    font-weight:800;
}

/* CALIBRATION MESSAGE */

#calibration{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:30;

    width:280px;

    padding:18px;

    border-radius:20px;

    background:rgba(10,12,18,.88);
    border:1px solid rgba(255,255,255,.15);

    color:white;

    text-align:center;

    backdrop-filter:blur(16px);

    display:none;
}

#calibration.show{
    display:block;
}

#calibration strong{
    display:block;
    margin-bottom:8px;
}

#calibration span{
    display:block;
    color:#b7bfce;
    font-size:12px;
    line-height:1.5;
}

.smallButton{
    margin-top:14px;

    border:0;
    border-radius:20px;

    padding:9px 16px;

    background:white;
    color:#111;

    font-weight:700;
}

/* ERROR */

#errorBox{
    position:absolute;
    left:20px;
    right:20px;
    top:50%;

    transform:translateY(-50%);

    z-index:100;

    display:none;

    padding:20px;

    border-radius:20px;

    background:#15171d;
    color:white;

    text-align:center;
}

#errorBox.show{
    display:block;
}

#errorBox p{
    color:#bfc4ce;
    font-size:13px;
    line-height:1.5;
}

@media (max-height:700px){
    .zoomBar{
        bottom:108px;
    }

    .modeBar{
        bottom:180px;
    }
}
</style>
</head>

<body>

<div id="app">

    <video
        id="camera"
        autoplay
        playsinline
        muted>
    </video>

    <canvas id="outputCanvas"></canvas>

    <div class="topBar">
        <div class="logo">HORIZON</div>
        <div id="status" class="status">CAMERA OFF</div>
    </div>

    <div id="angleBadge" class="angleBadge">
        0.0°
    </div>

    <div class="horizonIndicator"></div>

    <div class="modeBar">

        <button
            class="modeButton active"
            data-mode="flex">
            FLEX
        </button>

        <button
            class="modeButton"
            data-mode="locked">
            LOCKED
        </button>

    </div>

    <div class="zoomBar">

        <button
            class="zoomButton active"
            data-zoom="1">
            1×
        </button>

        <button
            class="zoomButton"
            data-zoom="1.5">
            1.5×
        </button>

        <button
            class="zoomButton"
            data-zoom="2">
            2×
        </button>

    </div>

    <div class="bottomControls">

        <div class="controlRow">

            <div class="sideControls">

                <button
                    id="calibrateButton"
                    class="circleButton"
                    title="Calibrate">
                    ◎
                </button>

            </div>

            <button
                id="recordButton"
                class="recordButton">
            </button>

            <div class="sideControls right">

                <button
                    id="cameraButton"
                    class="circleButton"
                    title="Camera">
                    ↻
                </button>

            </div>

        </div>

    </div>

    <div id="calibration">

        <strong>Horizon calibrated</strong>

        <span>
            Keep the phone in the position you want
            to use as level.
        </span>

        <button
            id="closeCalibration"
            class="smallButton">
            Done
        </button>

    </div>

    <div id="startScreen">

        <h1>Horizon</h1>

        <p>
            Portrait camera with smooth horizon
            stabilization and normal 1× / 1.5× / 2× zoom.
        </p>

        <button
            id="startButton"
            class="startButton">
            START CAMERA
        </button>

    </div>

    <div id="errorBox">

        <strong>Camera unavailable</strong>

        <p id="errorText">
            Please allow camera access and try again.
        </p>

    </div>

</div>

<script>
"use strict";

/* =========================================================
   ELEMENTS
========================================================= */

const video = document.getElementById("camera");
const canvas = document.getElementById("outputCanvas");
const ctx = canvas.getContext("2d", {
    alpha:false
});

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const status =
    document.getElementById("status");

const recordButton =
    document.getElementById("recordButton");

const cameraButton =
    document.getElementById("cameraButton");

const calibrateButton =
    document.getElementById("calibrateButton");

const calibration =
    document.getElementById("calibration");

const closeCalibration =
    document.getElementById("closeCalibration");

const angleBadge =
    document.getElementById("angleBadge");

const errorBox =
    document.getElementById("errorBox");

const errorText =
    document.getElementById("errorText");


/* =========================================================
   CAMERA STATE
========================================================= */

let stream = null;

let facingMode = "environment";

let cameraStarted = false;

let recording = false;

let mediaRecorder = null;

let recordedChunks = [];


/* =========================================================
   ZOOM
========================================================= */

/*
   IMPORTANT:

   We intentionally DO NOT use:

   track.applyConstraints({
       advanced:[{zoom:...}]
   });

   That caused the previous version to apply
   native zoom + canvas zoom simultaneously.

   This version uses canvas zoom only.

   Therefore:

       1×  = original camera image
       1.5× = 1.5 digital crop
       2×  = 2 digital crop
*/

let zoomLevel = 1;


/* =========================================================
   HORIZON STATE
========================================================= */

let mode = "flex";

/*
   Maximum correction.

   The image can NEVER be rotated more than
   45 degrees in either direction.
*/

const MAX_ROLL = 45;


/*
   Reference angle.

   When calibration happens, the current
   phone roll becomes the new zero position.
*/

let referenceRoll = 0;


/*
   Sensor values.
*/

let currentRoll = 0;

let targetRoll = 0;

let sensorReady = false;


/*
   Smoothing.

   Lower = smoother/slower.
*/

const SENSOR_SMOOTHING = 0.15;

const OUTPUT_SMOOTHING = 0.12;


/*
   Small dead zone prevents tiny sensor noise
   from constantly moving the image.
*/

const DEAD_ZONE = 1.0;


/* =========================================================
   SENSOR FILTER
========================================================= */

let filteredGamma = 0;

let calibrationSamples = [];

let calibratingAutomatically = false;


/* =========================================================
   CANVAS
========================================================= */

const OUTPUT_WIDTH = 720;
const OUTPUT_HEIGHT = 1280;

canvas.width = OUTPUT_WIDTH;
canvas.height = OUTPUT_HEIGHT;


/* =========================================================
   UTILITIES
========================================================= */

function clamp(value, min, max){

    return Math.max(
        min,
        Math.min(max, value)
    );
}


function normalizeAngle(angle){

    while(angle > 180){
        angle -= 360;
    }

    while(angle < -180){
        angle += 360;
    }

    return angle;
}


function setStatus(text, type=""){

    status.textContent = text;

    status.className =
        "status " + type;
}


/* =========================================================
   PORTRAIT LOCK
========================================================= */

async function lockPortrait(){

    try{

        if(
            screen.orientation &&
            screen.orientation.lock
        ){

            await screen.orientation.lock(
                "portrait"
            );
        }

    }catch(error){

        /*
           Some browsers only allow
           orientation.lock in fullscreen/PWA.

           Failure is harmless.
        */

        console.log(
            "Portrait lock unavailable:",
            error
        );
    }
}


/* =========================================================
   CAMERA
========================================================= */

async function startCamera(){

    try{

        if(stream){

            stream.getTracks().forEach(
                track => track.stop()
            );

            stream = null;
        }


        setStatus(
            "STARTING...",
            ""
        );


        stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:{
                        ideal:facingMode
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:1920
                    },

                    frameRate:{
                        ideal:30,
                        max:30
                    }
                },

                audio:true
            });


        video.srcObject = stream;

        await video.play();


        cameraStarted = true;

        startScreen.style.display = "none";

        errorBox.classList.remove("show");


        setStatus(
            "CAMERA READY",
            "ready"
        );


        await lockPortrait();


        /*
           Start automatic sensor calibration.
        */

        beginInitialCalibration();


        /*
           Start rendering.
        */

        requestAnimationFrame(
            renderFrame
        );

    }catch(error){

        console.error(error);

        cameraStarted = false;

        setStatus(
            "CAMERA ERROR",
            "error"
        );

        errorText.textContent =
            "Camera permission was denied or the camera could not be opened.";

        errorBox.classList.add("show");
    }
}


/* =========================================================
   CAMERA SWITCH
========================================================= */

async function switchCamera(){

    if(!cameraStarted){

        return;
    }

    facingMode =
        facingMode === "environment"
            ? "user"
            : "environment";


    await startCamera();
}


/* =========================================================
   INITIAL CALIBRATION
========================================================= */

function beginInitialCalibration(){

    calibrationSamples = [];

    calibratingAutomatically = true;

    sensorReady = false;


    /*
       Wait for several sensor readings.
       This avoids using one noisy reading.
    */

    setTimeout(() => {

        if(
            calibrationSamples.length > 0
        ){

            const sum =
                calibrationSamples.reduce(
                    (a,b) => a + b,
                    0
                );

            referenceRoll =
                sum /
                calibrationSamples.length;

            currentRoll = 0;
            targetRoll = 0;

            sensorReady = true;
        }

        calibratingAutomatically = false;

    }, 1000);
}


/* =========================================================
   MANUAL CALIBRATION
========================================================= */

function calibrate(){

    /*
       Current filtered sensor position
       becomes the new zero.
    */

    referenceRoll =
        filteredGamma;

    currentRoll = 0;
    targetRoll = 0;

    calibration.classList.add("show");

    setTimeout(() => {

        calibration.classList.remove("show");

    }, 1500);
}


/* =========================================================
   DEVICE ORIENTATION
========================================================= */

/*
   We use gamma ONLY.

   gamma represents left/right roll
   while the phone is held in portrait.

   We intentionally do NOT switch to beta
   when the phone becomes landscape.

   That was one of the causes of the previous
   90°/180° jumps.
*/

function handleOrientation(event){

    if(!cameraStarted){

        return;
    }


    let gamma =
        Number(event.gamma);


    if(!Number.isFinite(gamma)){

        return;
    }


    /*
       Keep gamma inside a sensible range.
    */

    gamma =
        clamp(
            gamma,
            -90,
            90
        );


    /*
       Smooth raw sensor.
    */

    filteredGamma =
        filteredGamma +
        (gamma - filteredGamma) *
        SENSOR_SMOOTHING;


    /*
       During startup, collect samples
       instead of moving the camera.
    */

    if(calibratingAutomatically){

        calibrationSamples.push(
            filteredGamma
        );

        return;
    }


    if(!sensorReady){

        return;
    }


    /*
       Difference from calibrated level.
    */

    let delta =
        normalizeAngle(
            filteredGamma -
            referenceRoll
        );


    /*
       NEVER allow the horizon correction
       to exceed ±45°.
    */

    delta =
        clamp(
            delta,
            -MAX_ROLL,
            MAX_ROLL
        );


    /*
       Dead zone.
    */

    if(Math.abs(delta) < DEAD_ZONE){

        delta = 0;
    }


    targetRoll = delta;
}


/* =========================================================
   DEVICE MOTION FALLBACK
========================================================= */

function handleMotion(event){

    /*
       OrientationEvent is preferred.

       This fallback is only used when
       orientation data is unavailable.
    */

    if(
        "DeviceOrientationEvent" in window
    ){

        return;
    }


    const acceleration =
        event.accelerationIncludingGravity;


    if(!acceleration){

        return;
    }


    const gx =
        Number(acceleration.x || 0);

    const gy =
        Number(acceleration.y || 0);


    if(
        !Number.isFinite(gx) ||
        !Number.isFinite(gy)
    ){

        return;
    }


    /*
       Portrait-only gravity roll.

       We do NOT rotate the coordinate system
       based on screen orientation.
    */

    const roll =
        Math.atan2(
            gx,
            -gy
        ) *
        180 /
        Math.PI;


    filteredGamma =
        filteredGamma +
        (roll - filteredGamma) *
        SENSOR_SMOOTHING;


    if(calibratingAutomatically){

        calibrationSamples.push(
            filteredGamma
        );

        return;
    }


    let delta =
        normalizeAngle(
            filteredGamma -
            referenceRoll
        );


    delta =
        clamp(
            delta,
            -MAX_ROLL,
            MAX_ROLL
        );


    if(Math.abs(delta) < DEAD_ZONE){

        delta = 0;
    }


    targetRoll = delta;
}


/* =========================================================
   SENSOR PERMISSION
========================================================= */

async function enableSensors(){

    try{

        /*
           iOS requires permission.

           Android normally does not.
        */

        if(
            typeof DeviceOrientationEvent !==
            "undefined" &&
            typeof DeviceOrientationEvent.requestPermission ===
            "function"
        ){

            const permission =
                await DeviceOrientationEvent
                    .requestPermission();

            if(permission !== "granted"){

                console.warn(
                    "Device orientation permission denied."
                );

                return;
            }
        }

    }catch(error){

        console.warn(
            "Sensor permission:",
            error
        );
    }


    window.addEventListener(
        "deviceorientation",
        handleOrientation,
        true
    );


    window.addEventListener(
        "devicemotion",
        handleMotion,
        true
    );
}


/* =========================================================
   RENDER CAMERA FRAME
========================================================= */

function renderFrame(){

    if(
        !cameraStarted ||
        video.readyState <
        HTMLMediaElement.HAVE_CURRENT_DATA
    ){

        requestAnimationFrame(
            renderFrame
        );

        return;
    }


    const vw =
        video.videoWidth;

    const vh =
        video.videoHeight;


    if(!vw || !vh){

        requestAnimationFrame(
            renderFrame
        );

        return;
    }


    /*
       Smooth final horizon angle.
    */

    if(mode === "locked"){

        currentRoll +=
            (0 - currentRoll) *
            OUTPUT_SMOOTHING;

    }else{

        currentRoll +=
            (targetRoll - currentRoll) *
            OUTPUT_SMOOTHING;
    }


    /*
       Safety clamp.

       Even after smoothing,
       the value can NEVER exceed ±45°.
    */

    currentRoll =
        clamp(
            currentRoll,
            -MAX_ROLL,
            MAX_ROLL
        );


    angleBadge.textContent =
        currentRoll.toFixed(1) + "°";


    /*
       Clear frame.
    */

    ctx.setTransform(
        1,0,0,1,0,0
    );

    ctx.fillStyle = "#000";

    ctx.fillRect(
        0,
        0,
        OUTPUT_WIDTH,
        OUTPUT_HEIGHT
    );


    /*
       Calculate a portrait camera crop.

       At 1× this is the BASE camera frame.
       There is no hidden native zoom.
    */

    const baseScale =
        Math.max(
            OUTPUT_WIDTH / vw,
            OUTPUT_HEIGHT / vh
        );


    const scale =
        baseScale * zoomLevel;


    const drawW =
        vw * scale;

    const drawH =
        vh * scale;


    /*
       Rotate around the center.
    */

    ctx.save();

    ctx.translate(
        OUTPUT_WIDTH / 2,
        OUTPUT_HEIGHT / 2
    );


    ctx.rotate(
        currentRoll *
        Math.PI /
        180
    );


    /*
       Mirror front camera.

       Rear camera remains normal.
    */

    if(facingMode === "user"){

        ctx.scale(
            -1,
            1
        );
    }


    ctx.drawImage(
        video,
        -drawW / 2,
        -drawH / 2,
        drawW,
        drawH
    );


    ctx.restore();


    /*
       Continue.
    */

    requestAnimationFrame(
        renderFrame
    );
}


/* =========================================================
   ZOOM BUTTONS
========================================================= */

document
    .querySelectorAll(".zoomButton")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                zoomLevel =
                    Number(
                        button.dataset.zoom
                    );


                document
                    .querySelectorAll(
                        ".zoomButton"
                    )
                    .forEach(b => {

                        b.classList.remove(
                            "active"
                        );
                    });


                button.classList.add(
                    "active"
                );
            }
        );
    });


/* =========================================================
   MODE BUTTONS
========================================================= */

document
    .querySelectorAll(".modeButton")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                mode =
                    button.dataset.mode;


                document
                    .querySelectorAll(
                        ".modeButton"
                    )
                    .forEach(b => {

                        b.classList.remove(
                            "active"
                        );
                    });


                button.classList.add(
                    "active"
                );
            }
        );
    });


/* =========================================================
   RECORDING
========================================================= */

function startRecording(){

    if(!cameraStarted){

        return;
    }


    recordedChunks = [];


    /*
       Record the PROCESSED canvas.

       This means the recorded video contains:

       • portrait output
       • horizon correction
       • selected zoom
    */

    const videoStream =
        canvas.captureStream(30);


    /*
       Add microphone audio.
    */

    if(stream){

        stream
            .getAudioTracks()
            .forEach(track => {

                videoStream.addTrack(
                    track
                );

            });
    }


    let mimeType =
        "";


    const types = [

        "video/webm;codecs=vp9,opus",

        "video/webm;codecs=vp8,opus",

        "video/webm"

    ];


    for(const type of types){

        if(
            MediaRecorder.isTypeSupported(
                type
            )
        ){

            mimeType = type;
            break;
        }
    }


    try{

        mediaRecorder =
            new MediaRecorder(
                videoStream,
                mimeType
                    ? {mimeType}
                    : undefined
            );

    }catch(error){

        console.error(error);

        return;
    }


    mediaRecorder.ondataavailable =
        event => {

            if(event.data.size > 0){

                recordedChunks.push(
                    event.data
                );
            }
        };


    mediaRecorder.onstop =
        saveRecording;


    mediaRecorder.start();


    recording = true;

    recordButton.classList.add(
        "recording"
    );

    setStatus(
        "RECORDING",
        "ready"
    );
}


/* =========================================================
   STOP RECORDING
========================================================= */

function stopRecording(){

    if(
        mediaRecorder &&
        mediaRecorder.state !== "inactive"
    ){

        mediaRecorder.stop();
    }

    recording = false;

    recordButton.classList.remove(
        "recording"
    );

    setStatus(
        "CAMERA READY",
        "ready"
    );
}


/* =========================================================
   SAVE RECORDING
========================================================= */

function saveRecording(){

    if(!recordedChunks.length){

        return;
    }


    const blob =
        new Blob(
            recordedChunks,
            {
                type:"video/webm"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        "horizon-video-" +
        Date.now() +
        ".webm";


    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(() => {

        URL.revokeObjectURL(url);

    }, 2000);
}


/* =========================================================
   BUTTON EVENTS
========================================================= */

startButton.addEventListener(
    "click",
    async () => {

        await enableSensors();

        await startCamera();

    }
);


recordButton.addEventListener(
    "click",
    () => {

        if(!recording){

            startRecording();

        }else{

            stopRecording();

        }
    }
);


cameraButton.addEventListener(
    "click",
    switchCamera
);


calibrateButton.addEventListener(
    "click",
    calibrate
);


closeCalibration.addEventListener(
    "click",
    () => {

        calibration.classList.remove(
            "show"
        );

    }
);


/* =========================================================
   INITIAL UI
========================================================= */

setStatus(
    "CAMERA OFF"
);


/*
   Prevent accidental page scrolling.
*/

document.addEventListener(
    "touchmove",
    event => {

        event.preventDefault();

    },
    {
        passive:false
    }
);
</script>
