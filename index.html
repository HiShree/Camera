<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Horizon Camera</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .camera-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 70vh;
            background: #000;
            overflow: hidden;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The viewfinder element that auto-levels based on device tilt */
        #viewfinder {
            width: 150%;
            height: 150%;
            object-fit: cover;
            position: absolute;
            transition: transform 0.05s linear;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .horizon-leveler {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .controls {
            margin-top: 1.5rem;
            display: flex;
            gap: 1rem;
        }

        .btn {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #4338ca;
        }
    </style>
</head>
<body>

    <div class="camera-container" id="frameBox">
        <div id="viewfinder">
            <video id="webcam" autoplay playsinline muted></video>
        </div>
        <div class="horizon-leveler" id="statusText">Level: 0°</div>
    </div>

    <div class="controls">
        <button class="btn" id="startCam">Start Camera</button>
        <button class="btn" id="permissionBtn" style="display:none;">Enable Gyroscope</button>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const viewfinder = document.getElementById('viewfinder');
        const statusText = document.getElementById('statusText');
        const startCamBtn = document.getElementById('startCam');
        const permissionBtn = document.getElementById('permissionBtn');

        // Start webcam stream
        startCamBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' }, 
                    audio: false 
                });
                video.srcObject = stream;
                startCamBtn.style.display = 'none';

                // Check if device orientation permission is needed (iOS 13+)
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    permissionBtn.style.display = 'inline-block';
                } else {
                    initOrientationListener();
                }
            } catch (err) {
                alert('Camera access denied or not supported.');
            }
        });

        // Handle iOS permission request
        permissionBtn.addEventListener('click', async () => {
            const response = await DeviceOrientationEvent.requestPermission();
            if (response === 'granted') {
                permissionBtn.style.display = 'none';
                initOrientationListener();
            } else {
                alert('Gyroscope permission is required for horizon leveling.');
            }
        });

        function initOrientationListener() {
            window.addEventListener('deviceorientation', (event) => {
                // Gamma represents left-to-right tilt (-90 to 90 degrees)
                let tilt = event.gamma || 0;
                
                // Clamp the tilt to prevent extreme rotation cutoffs
                if (tilt > 45) tilt = 45;
                if (tilt < -45) tilt = -45;

                // Apply dynamic counter-rotation to simulate horizon stabilization
                viewfinder.style.transform = `rotate(${-tilt}deg)`;
                statusText.innerText = `Level: ${Math.round(tilt)}°`;
            });
        }
    </script>
</body>
</html>
