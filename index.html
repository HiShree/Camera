<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto 4K Camera App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* Viewfinder Container */
        .viewfinder {
            position: relative;
            flex: 1;
            width: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Custom Camera Grid Overlay */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 20px solid rgba(0, 0, 0, 0.3);
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .focus-circle {
            width: 200px;
            height: 200px;
            border: 1px dashed rgba(255, 255, 255, 0.6);
            border-radius: 50%;
        }
        /* Controls Section */
        .controls {
            height: 120px;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        .shutter-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #fff;
            border: 4px solid #888;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .shutter-btn:active {
            transform: scale(0.9);
        }
        /* Result Preview Modal */
        .preview-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .preview-modal img {
            max-width: 90%;
            max-height: 70%;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(255,255,255,0.2);
        }
        .actions {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }
        .btn {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-secondary {
            background: #444;
        }
    </style>
</head>
<body>

    <!-- Camera Viewfinder -->
    <div class="viewfinder">
        <video id="cameraStream" autoplay playsinline></video>
        <div class="grid-overlay">
            <div class="focus-circle"></div>
        </div>
    </div>

    <!-- Bottom Controls -->
    <div class="controls">
        <button class="shutter-btn" id="captureBtn" title="Capture"></button>
    </div>

    <!-- Hidden Canvas for Processing -->
    <canvas id="photoCanvas" style="display:none;"></canvas>

    <!-- Preview & Enhanced Result Screen -->
    <div class="preview-modal" id="previewModal">
        <h2 style="margin-bottom: 15px; color: #4cd137;">✨ Auto-Enhanced 4K</h2>
        <img id="resultImage" alt="Captured Photo">
        <div class="actions">
            <button class="btn" id="downloadBtn">Download Photo</button>
            <button class="btn btn-secondary" id="retakeBtn">Retake</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('cameraStream');
        const captureBtn = document.getElementById('captureBtn');
        const canvas = document.getElementById('photoCanvas');
        const ctx = canvas.getContext('2d');
        const previewModal = document.getElementById('previewModal');
        const resultImage = document.getElementById('resultImage');
        const retakeBtn = document.getElementById('retakeBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        let enhancedDataUrl = '';

        // Initialize back camera stream
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                alert("Camera access error: " + err.message);
            }
        }
        initCamera();

        // Capture and Enhance Filter Logic
        captureBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Draw current frame onto canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Apply Automated Enhancement Filter (Simulating the 4K Auto-Edit pop)
            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let data = imgData.data;
            
            let contrast = 1.15; // Increase contrast slightly
            let brightness = 10;  // Lift brightness slightly

            for (let i = 0; i < data.length; i += 4) {
                // Adjust RGB for contrast and brightness
                data[i] = data[i] * contrast + brightness;     // Red
                data[i+1] = data[i+1] * contrast + brightness; // Green
                data[i+2] = data[i+2] * contrast + brightness; // Blue
            }
            ctx.putImageData(imgData, 0, 0);

            // Generate image URL
            enhancedDataUrl = canvas.toDataURL('image/jpeg', 0.95);
            resultImage.src = enhancedDataUrl;
            previewModal.style.display = 'flex';
        });

        // Retake button handler
        retakeBtn.addEventListener('click', () => {
            previewModal.style.display = 'none';
        });

        // Download button handler
        downloadBtn.addEventListener('click', () => {
            const a = document.createElement('a');
            a.href = enhancedDataUrl;
            a.download = `Enhanced_4K_${Date.now()}.jpg`;
            a.click();
        });
    </script>
</body>
</html>
