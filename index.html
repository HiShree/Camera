<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Mobile Camera App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0b0b0b;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        /* Phone-Sized Container Frame */
        .phone-frame {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 860px;
            background: #000;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 0;
            overflow: hidden;
        }
        @media (min-width: 450px) {
            .phone-frame {
                border-radius: 40px;
                border: 10px solid #222;
                height: 90vh;
            }
        }
        /* Viewfinder Section */
        .viewfinder {
            position: relative;
            flex: 1;
            width: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform-origin: center;
        }
        /* Top HUD */
        .top-hud {
            position: absolute;
            top: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 11px;
            letter-spacing: 1px;
            border: 1px solid rgba(255,255,255,0.15);
            z-index: 2;
        }
        /* Smooth Sliding Zoom Bar */
        .zoom-slider-container {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            height: 180px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 12px 6px;
            z-index: 3;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .zoom-slider-container span {
            font-size: 10px;
            font-weight: bold;
            color: #ff4757;
        }
        .zoom-range {
            writing-mode: vertical-lr;
            direction: rtl;
            width: 6px;
            height: 110px;
            accent-color: #ff4757;
            cursor: pointer;
        }
        /* Mode Selector */
        .mode-bar {
            height: 45px;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 12px;
            overflow-x: auto;
            white-space: nowrap;
        }
        .mode-bar::-webkit-scrollbar {
            display: none;
        }
        .mode-chip {
            padding: 4px 10px;
            background: #222;
            border: 1px solid #444;
            color: #aaa;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
        }
        .mode-chip.active {
            background: #ff4757;
            border-color: #ff4757;
            color: #fff;
            font-weight: bold;
        }
        /* Bottom Shutter Controls */
        .controls {
            height: 100px;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .shutter-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #fff;
            border: 4px solid #555;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
            transition: transform 0.08s ease;
        }
        .shutter-btn:active {
            transform: scale(0.9);
        }
        /* Preview Modal */
        .preview-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 10;
        }
        .preview-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .preview-container img {
            max-width: 100%;
            max-height: 65vh;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
        }
        .actions {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .btn-secondary {
            background: #333;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- Viewfinder -->
        <div class="viewfinder">
            <video id="cameraStream" autoplay playsinline></video>
            <div class="top-hud">⚡ INSTANT 4K AI</div>
            
            <!-- Smooth Sliding Zoom Bar -->
            <div class="zoom-slider-container">
                <span id="zoomLabel">1x</span>
                <input type="range" id="zoomRange" class="zoom-range" min="1" max="5" step="0.1" value="1">
            </div>
        </div>

        <!-- Mode Selector -->
        <div class="mode-bar">
            <button class="mode-chip active" data-mode="forest">🌲 Forest & Path</button>
            <button class="mode-chip" data-mode="vehicle">🚙 Vehicle / Street</button>
            <button class="mode-chip" data-mode="hdr">🌅 Cinematic HDR</button>
        </div>

        <!-- Shutter Controls -->
        <div class="controls">
            <button class="shutter-btn" id="captureBtn"></button>
        </div>

        <canvas id="photoCanvas" style="display:none;"></canvas>

        <!-- Preview Modal -->
        <div class="preview-modal" id="previewModal">
            <h3 style="color: #ff4757; text-align: center; margin-top: 10px;">✨ Instant Enhance Applied</h3>
            
            <div class="preview-container">
                <img id="resultImage" alt="Captured Preview">
            </div>

            <div class="actions">
                <button class="btn btn-secondary" id="retakeBtn">Retake</button>
                <button class="btn" id="downloadBtn">Save Photo</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('cameraStream');
        const captureBtn = document.getElementById('captureBtn');
        const canvas = document.getElementById('photoCanvas');
        const ctx = canvas.getContext('2d');
        
        const previewModal = document.getElementById('previewModal');
        const resultImage = document.getElementById('resultImage');
        const retakeBtn = document.getElementById('retakeBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const modeChips = document.querySelectorAll('.mode-chip');
        const zoomRange = document.getElementById('zoomRange');
        const zoomLabel = document.getElementById('zoomLabel');

        let selectedMode = 'forest';
        let imageTrack = null;
        let finalDataUrl = '';

        // Initialize Camera
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                });
                video.srcObject = stream;
                imageTrack = stream.getVideoTracks()[0];
            } catch (err) {
                alert("Camera access error: " + err.message);
            }
        }
        initCamera();

        // Smooth Zoom Slider Control
        zoomRange.addEventListener('input', async (e) => {
            const val = e.target.value;
            zoomLabel.innerText = `${val}x`;
            if (imageTrack) {
                const capabilities = imageTrack.getCapabilities();
                if (capabilities.zoom) {
                    try {
                        await imageTrack.applyConstraints({ advanced: [{ zoom: parseFloat(val) }] });
                        return;
                    } catch (err) { console.log("Hardware zoom not supported, using CSS fallback"); }
                }
            }
            // Fallback CSS smooth scale transform for browsers without hardware zoom control
            video.style.transform = `scale(${val})`;
        });

        modeChips.forEach(chip => {
            chip.addEventListener('click', (e) => {
                modeChips.forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                selectedMode = e.target.getAttribute('data-mode');
            });
        });

        // Fast & Instantaneous Capture Processing Engine
        captureBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            
            // Fast single-pass draw
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Apply lightning-fast canvas composite filters depending on mode (No heavy lag loops)
            ctx.save();
            if (selectedMode === 'forest') {
                ctx.filter = 'contrast(125%) brightness(105%) saturate(115%)';
            } else if (selectedMode === 'vehicle') {
                ctx.filter = 'contrast(140%) brightness(95%) saturate(120%)';
            } else {
                ctx.filter = 'contrast(120%) saturate(110%)';
            }
            ctx.drawImage(canvas, 0, 0);
            ctx.restore();

            // Burn Professional Camera Metadata Watermark at Bottom instantly
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, canvas.height - 80, canvas.width, 80);

            ctx.fillStyle = "#111111";
            ctx.font = `bold ${Math.max(14, canvas.width / 45)}px sans-serif`;
            ctx.fillText("ASUS_I003DD", 30, canvas.height - 35);

            ctx.font = `${Math.max(12, canvas.width / 55)}px sans-serif`;
            ctx.fillText("5mm f/1.8  1/320 ISO25", canvas.width - 280, canvas.height - 35);

            // Instant data URL generation and UI display
            finalDataUrl = canvas.toDataURL('image/jpeg', 0.9);
            resultImage.src = finalDataUrl;
            previewModal.style.display = 'flex';
        });

        retakeBtn.addEventListener('click', () => {
            previewModal.style.display = 'none';
        });

        downloadBtn.addEventListener('click', () => {
            const a = document.createElement('a');
            a.href = finalDataUrl;
            a.download = `Pro_Shot_${Date.now()}.jpg`;
            a.click();
        });
    </script>
</body>
</html>
