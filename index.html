<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Cinematic 4K Camera</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* Viewfinder Container */
        .viewfinder {
            position: relative;
            flex: 1;
            width: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* HUD & Framing Overlay */
        .hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .top-hud {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            background: rgba(0,0,0,0.6);
            padding: 6px 14px;
            border-radius: 20px;
            align-self: center;
            letter-spacing: 1px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .focus-circle {
            width: 180px;
            height: 180px;
            border: 1px dashed rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        /* Controls Section */
        .controls {
            height: 120px;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .shutter-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #fff;
            border: 4px solid #777;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255,255,255,0.4);
            transition: transform 0.1s;
        }
        .shutter-btn:active {
            transform: scale(0.92);
        }
        /* Preview Modal */
        .preview-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 10;
        }
        .preview-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .preview-container img {
            max-width: 100%;
            max-height: 70vh;
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
        }
        .actions {
            display: flex;
            gap: 15px;
        }
        .btn {
            flex: 1;
            padding: 14px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .btn-secondary {
            background: #333;
        }
    </style>
</head>
<body>

    <!-- Camera Viewfinder -->
    <div class="viewfinder">
        <video id="cameraStream" autoplay playsinline></video>
        <div class="hud-overlay">
            <div class="top-hud">
                <span>⚡ CINEMATIC AUTO VIGNETTE • 4K</span>
            </div>
            <div class="focus-circle"></div>
        </div>
    </div>

    <!-- Shutter Controls -->
    <div class="controls">
        <button class="shutter-btn" id="captureBtn"></button>
    </div>

    <canvas id="photoCanvas" style="display:none;"></canvas>

    <!-- Post-Capture Result Screen -->
    <div class="preview-modal" id="previewModal">
        <h3 style="color: #4cd137; text-align: center; margin-top: 10px;">✨ Automatic Cinematic Grade Applied</h3>
        
        <div class="preview-container">
            <img id="resultImage" alt="Cinematic Output">
        </div>

        <div class="actions">
            <button class="btn btn-secondary" id="retakeBtn">Retake</button>
            <button class="btn" id="downloadBtn">Download Photo</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('cameraStream');
        const captureBtn = document.getElementById('captureBtn');
        const canvas = document.getElementById('photoCanvas');
        const ctx = canvas.getContext('2d');
        
        const previewModal = document.getElementById('previewModal');
        const resultImage = document.getElementById('resultImage');
        const retakeBtn = document.getElementById('retakeBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        let finalDataUrl = '';

        // Initialize Camera Stream
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 3840 }, height: { ideal: 2160 } },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                alert("Camera access error: " + err.message);
            }
        }
        initCamera();

        // Capture & Automatic Cinematic Editing Pipeline
        captureBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth || 1920;
            canvas.height = video.videoHeight || 1080;
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let data = imgData.data;

            let centerX = canvas.width / 2;
            let centerY = canvas.height / 2;
            let maxDist = Math.sqrt(centerX * centerX + centerY * centerY);

            // Step 1: Apply Cinematic Vignette, Deep Shadows, and High Contrast Pop
            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    let i = (y * canvas.width + x) * 4;
                    let r = data[i], g = data[i+1], b = data[i+2];

                    // High contrast curve adjustments
                    r = ((r / 255 - 0.5) * 1.3 + 0.5) * 255;
                    g = ((g / 255 - 0.5) * 1.3 + 0.5) * 255;
                    b = ((b / 255 - 0.5) * 1.3 + 0.5) * 255;

                    // Cinematic Color Grading (Warm/Moody tone shifts)
                    r *= 1.05; 
                    b *= 0.95;

                    // Distance-based Vignette (Darken background edges heavily like the reference photo)
                    let distX = x - centerX;
                    let distY = y - centerY;
                    let distance = Math.sqrt(distX * distX + distY * distY);
                    let vignetteFactor = 1 - (distance / maxDist) * 0.65;
                    vignetteFactor = Math.max(0.3, Math.min(1, vignetteFactor));

                    r *= vignetteFactor;
                    g *= vignetteFactor;
                    b *= vignetteFactor;

                    data[i]   = Math.min(255, Math.max(0, r));
                    data[i+1] = Math.min(255, Math.max(0, g));
                    data[i+2] = Math.min(255, Math.max(0, b));
                }
            }

            ctx.putImageData(imgData, 0, 0);

            // Step 2: Burn Professional Camera Metadata Watermark at the Bottom (matching the style in[span_2](start_span)[span_2](end_span))
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, canvas.height - 130, canvas.width, 130);

            ctx.fillStyle = "#111111";
            ctx.font = `bold ${Math.max(20, canvas.width / 40)}px sans-serif`;
            ctx.fillText("ASUS_I003DD", 50, canvas.height - 65);

            ctx.font = `${Math.max(16, canvas.width / 50)}px sans-serif`;
            ctx.fillText("5mm f/1.8  1/320 ISO25", canvas.width - 450, canvas.height - 65);

            // Display preview
            finalDataUrl = canvas.toDataURL('image/jpeg', 0.95);
            resultImage.src = finalDataUrl;
            previewModal.style.display = 'flex';
        });

        retakeBtn.addEventListener('click', () => {
            previewModal.style.display = 'none';
        });

        downloadBtn.addEventListener('click', () => {
            const a = document.createElement('a');
            a.href = finalDataUrl;
            a.download = `Cinematic_Auto_Edit_${Date.now()}.jpg`;
            a.click();
        });
    </script>
</body>
</html>
