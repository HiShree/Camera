<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>Horizon Camera</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#app{
    position:relative;
    width:100%;
    height:100%;
    max-width:540px;
    overflow:hidden;
    background:#000;
}

/* =====================================================
   CAMERA
===================================================== */

#camera{
    display:none;
}

#outputCanvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    display:block;

    background:#000;
}

/* =====================================================
   TOP BAR
===================================================== */

.topBar{
    position:absolute;

    top:0;
    left:0;
    right:0;

    z-index:20;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:
        calc(env(safe-area-inset-top) + 14px)
        16px
        18px;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.75),
            rgba(0,0,0,0)
        );
}

.logo{
    color:white;

    font-size:18px;
    font-weight:900;
    letter-spacing:1px;
}

.status{
    padding:7px 11px;

    border-radius:20px;

    background:rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,.15);

    color:white;

    font-size:10px;
    font-weight:800;

    backdrop-filter:blur(12px);
}

.status.ready{
    color:#75ffac;
}

.status.recording{
    color:#ff5360;
}

/* =====================================================
   ANGLE
===================================================== */

.angleBadge{
    position:absolute;

    top:calc(env(safe-area-inset-top) + 67px);
    left:50%;

    transform:translateX(-50%);

    z-index:15;

    padding:6px 11px;

    border-radius:20px;

    background:rgba(0,0,0,.42);

    color:white;

    font-size:11px;
    font-weight:800;

    backdrop-filter:blur(10px);
}

/* =====================================================
   HORIZON GUIDE
===================================================== */

.horizonGuide{
    position:absolute;

    top:50%;
    left:50%;

    width:160px;
    height:2px;

    transform:translate(-50%,-50%);

    z-index:12;

    background:rgba(255,255,255,.72);

    box-shadow:
        0 0 8px rgba(255,255,255,.35);

    opacity:.48;

    pointer-events:none;
}

.horizonGuide::before,
.horizonGuide::after{
    content:"";

    position:absolute;

    top:50%;

    width:2px;
    height:12px;

    transform:translateY(-50%);

    background:#fff;
}

.horizonGuide::before{
    left:0;
}

.horizonGuide::after{
    right:0;
}

/* =====================================================
   MODE BAR
===================================================== */

.modeBar{
    position:absolute;

    left:50%;
    bottom:213px;

    transform:translateX(-50%);

    z-index:25;

    display:flex;

    padding:5px;

    border-radius:30px;

    background:rgba(0,0,0,.48);

    border:1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(14px);
}

.modeButton{
    border:0;

    background:transparent;

    color:rgba(255,255,255,.6);

    padding:8px 13px;

    border-radius:22px;

    font-size:10px;
    font-weight:900;
}

.modeButton.active{
    background:rgba(255,255,255,.2);

    color:#fff;
}

/* =====================================================
   ZOOM BAR
===================================================== */

.zoomBar{
    position:absolute;

    left:50%;
    bottom:125px;

    transform:translateX(-50%);

    z-index:25;

    display:flex;
    gap:6px;

    padding:6px;

    border-radius:30px;

    background:rgba(0,0,0,.5);

    border:1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(14px);
}

.zoomButton{
    width:50px;
    height:34px;

    border:0;

    border-radius:20px;

    background:transparent;

    color:white;

    font-size:12px;
    font-weight:900;
}

.zoomButton.active{
    background:white;

    color:#111;
}

/* =====================================================
   BOTTOM CONTROLS
===================================================== */

.bottomControls{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    z-index:25;

    padding:
        12px
        18px
        calc(env(safe-area-inset-bottom) + 18px);

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.88),
            rgba(0,0,0,0)
        );
}

.controlRow{
    display:flex;

    align-items:center;

    justify-content:space-between;
}

.side{
    width:85px;

    display:flex;
    gap:9px;
}

.side.right{
    justify-content:flex-end;
}

.circleButton{
    width:48px;
    height:48px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.18);

    background:rgba(0,0,0,.48);

    color:#fff;

    font-size:18px;

    backdrop-filter:blur(12px);
}

.recordButton{
    width:74px;
    height:74px;

    border-radius:50%;

    border:7px solid rgba(255,255,255,.35);

    background:#fff;

    box-shadow:
        0 0 0 2px rgba(255,255,255,.5);
}

.recordButton.recording{
    background:#ff3345;
}

/* =====================================================
   START SCREEN
===================================================== */

#startScreen{
    position:absolute;

    inset:0;

    z-index:100;

    display:flex;

    flex-direction:column;

    justify-content:center;
    align-items:center;

    padding:30px;

    text-align:center;

    color:#fff;

    background:
        radial-gradient(
            circle at 50% 30%,
            #1b2d4c,
            #05070b 68%
        );
}

#startScreen h1{
    margin:0 0 8px;

    font-size:34px;
    font-weight:900;
}

#startScreen p{
    max-width:310px;

    margin:0 0 26px;

    color:#b9c2d0;

    font-size:13px;

    line-height:1.6;
}

.startButton{
    width:230px;

    padding:15px;

    border:0;

    border-radius:30px;

    background:#fff;

    color:#111;

    font-size:14px;
    font-weight:900;
}

/* =====================================================
   CALIBRATION POPUP
===================================================== */

#calibrationPopup{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:80;

    display:none;

    width:285px;

    padding:20px;

    border-radius:20px;

    background:rgba(10,12,18,.92);

    border:1px solid rgba(255,255,255,.14);

    color:#fff;

    text-align:center;

    backdrop-filter:blur(18px);
}

#calibrationPopup.show{
    display:block;
}

#calibrationPopup strong{
    display:block;

    margin-bottom:8px;

    font-size:16px;
}

#calibrationPopup span{
    display:block;

    color:#b9c0cc;

    font-size:12px;

    line-height:1.5;
}

.smallButton{
    margin-top:14px;

    padding:9px 17px;

    border:0;

    border-radius:20px;

    background:#fff;

    color:#111;

    font-weight:800;
}

/* =====================================================
   ERROR
===================================================== */

#errorBox{
    position:absolute;

    left:20px;
    right:20px;
    top:50%;

    transform:translateY(-50%);

    z-index:200;

    display:none;

    padding:20px;

    border-radius:20px;

    background:#15171d;

    color:#fff;

    text-align:center;
}

#errorBox.show{
    display:block;
}

#errorBox p{
    color:#b9bec8;

    font-size:13px;

    line-height:1.5;
}

/* =====================================================
   SMALL SCREEN
===================================================== */

@media(max-height:700px){

    .modeBar{
        bottom:180px;
    }

    .zoomBar{
        bottom:105px;
    }

    .recordButton{
        width:66px;
        height:66px;
    }

}
</style>
</head>

<body>

<div id="app">

    <!-- =================================================
         RAW CAMERA
    ================================================== -->

    <video
        id="camera"
        autoplay
        playsinline
        muted>
    </video>


    <!-- =================================================
         PROCESSED CAMERA
    ================================================== -->

    <canvas id="outputCanvas"></canvas>


    <!-- =================================================
         TOP
    ================================================== -->

    <div class="topBar">

        <div class="logo">
            HORIZON
        </div>

        <div
            id="status"
            class="status">
            CAMERA OFF
        </div>

    </div>


    <!-- =================================================
         ANGLE
    ================================================== -->

    <div
        id="angleBadge"
        class="angleBadge">
        0.0°
    </div>


    <!-- =================================================
         HORIZON GUIDE
    ================================================== -->

    <div class="horizonGuide"></div>


    <!-- =================================================
         MODES
    ================================================== -->

    <div class="modeBar">

        <button
            class="modeButton active"
            data-mode="flex">

            FLEX

        </button>

        <button
            class="modeButton"
            data-mode="rotate">

            ROTATE

        </button>

        <button
            class="modeButton"
            data-mode="locked">

            LOCKED

        </button>

    </div>


    <!-- =================================================
         ZOOM
    ================================================== -->

    <div class="zoomBar">

        <button
            class="zoomButton active"
            data-zoom="1">

            1×

        </button>

        <button
            class="zoomButton"
            data-zoom="1.5">

            1.5×

        </button>

        <button
            class="zoomButton"
            data-zoom="2">

            2×

        </button>

    </div>


    <!-- =================================================
         BOTTOM
    ================================================== -->

    <div class="bottomControls">

        <div class="controlRow">

            <div class="side">

                <button
                    id="calibrateButton"
                    class="circleButton">

                    ◎

                </button>

            </div>


            <button
                id="recordButton"
                class="recordButton">
            </button>


            <div class="side right">

                <button
                    id="cameraButton"
                    class="circleButton">

                    ↻

                </button>

            </div>

        </div>

    </div>


    <!-- =================================================
         CALIBRATION POPUP
    ================================================== -->

    <div id="calibrationPopup">

        <strong>
            Horizon calibrated
        </strong>

        <span>
            The current phone position is now
            treated as level.
        </span>

        <button
            id="closeCalibration"
            class="smallButton">

            Done

        </button>

    </div>


    <!-- =================================================
         START
    ================================================== -->

    <div id="startScreen">

        <h1>
            Horizon
        </h1>

        <p>
            Portrait horizon camera with gyro
            stabilization, 1× / 1.5× / 2× zoom,
            and smooth horizon correction.
        </p>

        <button
            id="startButton"
            class="startButton">

            START CAMERA

        </button>

    </div>


    <!-- =================================================
         ERROR
    ================================================== -->

    <div id="errorBox">

        <strong>
            Camera unavailable
        </strong>

        <p id="errorText">
            Please allow camera access and try again.
        </p>

    </div>

</div>


<script>
"use strict";

/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("outputCanvas");

const ctx =
    canvas.getContext("2d", {
        alpha:false
    });

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const status =
    document.getElementById("status");

const angleBadge =
    document.getElementById("angleBadge");

const recordButton =
    document.getElementById("recordButton");

const cameraButton =
    document.getElementById("cameraButton");

const calibrateButton =
    document.getElementById("calibrateButton");

const calibrationPopup =
    document.getElementById("calibrationPopup");

const closeCalibration =
    document.getElementById("closeCalibration");

const errorBox =
    document.getElementById("errorBox");

const errorText =
    document.getElementById("errorText");


/* =====================================================
   OUTPUT SIZE

   Portrait video.
===================================================== */

const OUTPUT_WIDTH = 720;
const OUTPUT_HEIGHT = 1280;

canvas.width = OUTPUT_WIDTH;
canvas.height = OUTPUT_HEIGHT;


/* =====================================================
   CAMERA
===================================================== */

let stream = null;

let facingMode = "environment";

let cameraStarted = false;


/* =====================================================
   ZOOM

   IMPORTANT:

   There is NO track.applyConstraints({zoom})
   anywhere in this version.

   Therefore 1× is the unzoomed camera frame.
===================================================== */

let zoomLevel = 1;


/* =====================================================
   MODES
===================================================== */

let mode = "flex";


/*
   FLEX:
   Full horizon correction with ±45° limit.

   ROTATE:
   Horizon correction follows the phone smoothly,
   while the crop is kept stable.

   LOCKED:
   No sensor correction.
*/


/* =====================================================
   HORIZON LIMIT
===================================================== */

const MAX_ROLL = 45;


/* =====================================================
   SENSOR FILTER
===================================================== */

/*
   The main sensor pipeline is:

       Gyroscope angular velocity
                    +
             Gravity vector
                    ↓
           Complementary filter
                    ↓
              Roll angle
                    ↓
             ±45° limiter
                    ↓
                Canvas
*/


let gyroRoll = 0;

let filteredRoll = 0;

let targetRoll = 0;

let outputRoll = 0;


/*
   Calibration offset.
*/

let calibrationOffset = 0;


/*
   Gravity-derived roll.

   Used to correct gyro drift.
*/

let gravityRoll = 0;


/*
   Sensor timestamps.
*/

let lastSensorTime = null;


/*
   Whether the sensor has started.
*/

let sensorStarted = false;


/*
   If DeviceMotion is unavailable,
   DeviceOrientation becomes fallback.
*/

let usingOrientationFallback = false;


/* =====================================================
   SENSOR TUNING
===================================================== */

const GYRO_WEIGHT = 0.985;

const GRAVITY_WEIGHT = 0.015;


/*
   Output smoothing.
*/

const OUTPUT_SMOOTHING = 0.13;


/*
   Small dead zone.
*/

const DEAD_ZONE = 0.7;


/* =====================================================
   UTILITIES
===================================================== */

function clamp(value,min,max){

    return Math.max(
        min,
        Math.min(max,value)
    );
}


function normalizeAngle(angle){

    while(angle > 180){
        angle -= 360;
    }

    while(angle < -180){
        angle += 360;
    }

    return angle;
}


function smoothAngle(current,target,factor){

    let difference =
        normalizeAngle(
            target - current
        );

    return current +
        difference * factor;
}


function setStatus(text,type=""){

    status.textContent = text;

    status.className =
        "status " + type;
}


/* =====================================================
   PORTRAIT LOCK
===================================================== */

async function lockPortrait(){

    try{

        if(
            screen.orientation &&
            screen.orientation.lock
        ){

            await screen.orientation.lock(
                "portrait"
            );
        }

    }catch(error){

        /*
           Normal browsers may reject this
           unless the page is fullscreen/PWA.

           The rest of the app continues normally.
        */

        console.log(
            "Portrait lock unavailable:",
            error
        );
    }
}


/* =====================================================
   CAMERA START
===================================================== */

async function startCamera(){

    try{

        if(stream){

            stream.getTracks().forEach(
                track => track.stop()
            );

            stream = null;
        }


        setStatus(
            "STARTING..."
        );


        /*
           Deliberately no zoom constraint.
        */

        stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:{
                        ideal:facingMode
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:1920
                    },

                    frameRate:{
                        ideal:30,
                        max:30
                    }
                },

                audio:true

            });


        video.srcObject = stream;

        await video.play();


        cameraStarted = true;


        startScreen.style.display =
            "none";


        errorBox.classList.remove(
            "show"
        );


        setStatus(
            "CAMERA READY",
            "ready"
        );


        await lockPortrait();


        /*
           Start sensor pipeline.
        */

        resetSensorState();


        /*
           Render.
        */

        requestAnimationFrame(
            renderFrame
        );


    }catch(error){

        console.error(error);

        cameraStarted = false;

        setStatus(
            "CAMERA ERROR",
            "error"
        );

        errorText.textContent =
            "Camera permission was denied or the camera could not be opened.";

        errorBox.classList.add(
            "show"
        );
    }
}


/* =====================================================
   CAMERA SWITCH
===================================================== */

async function switchCamera(){

    if(!cameraStarted){

        return;
    }

    facingMode =
        facingMode === "environment"
            ? "user"
            : "environment";


    await startCamera();
}


/* =====================================================
   SENSOR RESET
===================================================== */

function resetSensorState(){

    gyroRoll = 0;

    filteredRoll = 0;

    targetRoll = 0;

    outputRoll = 0;

    gravityRoll = 0;

    calibrationOffset = 0;

    lastSensorTime = null;

    sensorStarted = false;
}


/* =====================================================
   GRAVITY ROLL

   Portrait coordinate system.

   x = left/right gravity
   y = up/down gravity
===================================================== */

function calculateGravityRoll(gx,gy){

    if(
        !Number.isFinite(gx) ||
        !Number.isFinite(gy)
    ){

        return null;
    }


    let angle =
        Math.atan2(
            gx,
            -gy
        ) *
        180 /
        Math.PI;


    angle =
        normalizeAngle(angle);


    /*
       Gravity roll is only used as a
       correction reference.

       It is NEVER allowed to directly
       rotate the camera 90°/180°.
    */

    return angle;
}


/* =====================================================
   DEVICE MOTION

   MAIN SENSOR SYSTEM
===================================================== */

function handleDeviceMotion(event){

    if(!cameraStarted){

        return;
    }


    const rotation =
        event.rotationRate;


    const acceleration =
        event.accelerationIncludingGravity;


    if(!rotation){

        return;
    }


    /*
       DeviceMotion rotationRate.gamma is
       the roll angular velocity for the
       portrait device coordinate system.

       Units:
       degrees per second.
    */

    let gyroSpeed =
        Number(rotation.gamma);


    if(!Number.isFinite(gyroSpeed)){

        return;
    }


    /*
       Gravity reference.
    */

    if(acceleration){

        const gx =
            Number(acceleration.x);

        const gy =
            Number(acceleration.y);


        const calculated =
            calculateGravityRoll(
                gx,
                gy
            );


        if(
            calculated !== null
        ){

            gravityRoll =
                smoothAngle(
                    gravityRoll,
                    calculated,
                    0.08
                );
        }
    }


    const now =
        performance.now();


    if(lastSensorTime === null){

        lastSensorTime = now;

        sensorStarted = true;

        /*
           Initialize the integrated gyro
           to the gravity reference.
        */

        gyroRoll =
            gravityRoll;

        filteredRoll =
            gravityRoll;

        return;
    }


    let dt =
        (now - lastSensorTime) /
        1000;


    lastSensorTime = now;


    /*
       Protect against browser pauses.
    */

    dt =
        clamp(
            dt,
            0,
            0.1
        );


    /*
       Integrate gyroscope.

       Positive/negative direction may differ
       between devices, so the resulting value
       is normalized below.
    */

    gyroRoll +=
        gyroSpeed * dt;


    gyroRoll =
        normalizeAngle(
            gyroRoll
        );


    /*
       COMPLEMENTARY FILTER

       Gyroscope:
       - fast
       - smooth movement
       - does not know absolute level

       Gravity:
       - absolute level
       - noisy during movement

       Combining them gives much better
       horizon tracking than using gamma alone.
    */

    let fused =
        gyroRoll * GYRO_WEIGHT +
        gravityRoll * GRAVITY_WEIGHT;


    /*
       Keep the filter from suddenly choosing
       another 180° equivalent angle.
    */

    fused =
        normalizeAngle(
            fused
        );


    filteredRoll =
        smoothAngle(
            filteredRoll,
            fused,
            0.20
        );


    /*
       Relative to calibration.
    */

    let relative =
        normalizeAngle(
            filteredRoll -
            calibrationOffset
        );


    /*
       HARD LIMIT.

       This is the important protection
       against the previous huge rotations.
    */

    relative =
        clamp(
            relative,
            -MAX_ROLL,
            MAX_ROLL
        );


    /*
       Dead zone.
    */

    if(
        Math.abs(relative) <
        DEAD_ZONE
    ){

        relative = 0;
    }


    targetRoll = relative;
}


/* =====================================================
   DEVICE ORIENTATION FALLBACK
===================================================== */

function handleOrientation(event){

    /*
       DeviceMotion is preferred.

       This function is only used if
       rotationRate is unavailable.
    */

    if(!usingOrientationFallback){

        return;
    }


    if(!cameraStarted){

        return;
    }


    let gamma =
        Number(event.gamma);


    if(!Number.isFinite(gamma)){

        return;
    }


    gamma =
        clamp(
            gamma,
            -90,
            90
        );


    /*
       Calibrated relative angle.
    */

    let relative =
        normalizeAngle(
            gamma -
            calibrationOffset
        );


    relative =
        clamp(
            relative,
            -MAX_ROLL,
            MAX_ROLL
        );


    if(
        Math.abs(relative) <
        DEAD_ZONE
    ){

        relative = 0;
    }


    targetRoll = relative;
}


/* =====================================================
   SENSOR PERMISSION
===================================================== */

async function enableSensors(){

    try{

        /*
           iOS requires explicit permission.
        */

        if(
            typeof DeviceMotionEvent !==
            "undefined" &&

            typeof DeviceMotionEvent.requestPermission ===
            "function"
        ){

            const result =
                await DeviceMotionEvent
                    .requestPermission();


            if(result !== "granted"){

                console.warn(
                    "Motion permission denied"
                );
            }
        }


        if(
            typeof DeviceOrientationEvent !==
            "undefined" &&

            typeof DeviceOrientationEvent.requestPermission ===
            "function"
        ){

            const result =
                await DeviceOrientationEvent
                    .requestPermission();


            if(result !== "granted"){

                console.warn(
                    "Orientation permission denied"
                );
            }
        }


    }catch(error){

        console.warn(
            "Sensor permission:",
            error
        );
    }


    /*
       Detect whether DeviceMotion can
       actually provide rotationRate.
    */

    usingOrientationFallback = false;


    window.addEventListener(
        "devicemotion",
        handleDeviceMotion,
        true
    );


    window.addEventListener(
        "deviceorientation",
        handleOrientation,
        true
    );


    /*
       Wait briefly.

       If no motion sensor arrives,
       orientation becomes fallback.
    */

    setTimeout(() => {

        if(!sensorStarted){

            usingOrientationFallback = true;

            console.log(
                "Using DeviceOrientation fallback"
            );
        }

    },1500);
}


/* =====================================================
   CALIBRATION
===================================================== */

function calibrate(){

    /*
       Current fused roll becomes zero.

       This is a relative calibration,
       not a new sensor system.
    */

    calibrationOffset =
        filteredRoll;


    gyroRoll =
        filteredRoll;


    targetRoll = 0;

    outputRoll = 0;


    calibrationPopup.classList.add(
        "show"
    );


    setTimeout(() => {

        calibrationPopup.classList.remove(
            "show"
        );

    },1500);
}


/* =====================================================
   CANVAS DRAWING
===================================================== */

function renderFrame(){

    if(
        !cameraStarted ||
        video.readyState <
        HTMLMediaElement.HAVE_CURRENT_DATA
    ){

        requestAnimationFrame(
            renderFrame
        );

        return;
    }


    const vw =
        video.videoWidth;

    const vh =
        video.videoHeight;


    if(!vw || !vh){

        requestAnimationFrame(
            renderFrame
        );

        return;
    }


    /*
       Mode handling.
    */

    let desiredRoll;


    if(mode === "locked"){

        desiredRoll = 0;

    }else{

        desiredRoll =
            targetRoll;
    }


    /*
       Smooth output.
    */

    outputRoll =
        smoothAngle(
            outputRoll,
            desiredRoll,
            OUTPUT_SMOOTHING
        );


    /*
       Absolute safety limit.
    */

    outputRoll =
        clamp(
            outputRoll,
            -MAX_ROLL,
            MAX_ROLL
        );


    angleBadge.textContent =
        outputRoll.toFixed(1) + "°";


    /*
       Clear.
    */

    ctx.setTransform(
        1,0,0,1,0,0
    );

    ctx.fillStyle = "#000";

    ctx.fillRect(
        0,
        0,
        OUTPUT_WIDTH,
        OUTPUT_HEIGHT
    );


    /*
       BASE CAMERA SCALE.

       This represents 1×.

       There is no hidden zoom.
    */

    const baseScale =
        Math.max(
            OUTPUT_WIDTH / vw,
            OUTPUT_HEIGHT / vh
        );


    /*
       User-selected zoom.

       Only:
       1
       1.5
       2
    */

    const finalScale =
        baseScale *
        zoomLevel;


    const drawWidth =
        vw *
        finalScale;

    const drawHeight =
        vh *
        finalScale;


    /*
       FLEX MODE

       Add a small amount of dynamic
       framing so rotation does not
       immediately expose black corners.
    */

    let framingScale = 1;


    if(mode === "flex"){

        const rotationAmount =
            Math.abs(outputRoll) /
            MAX_ROLL;


        /*
           Maximum extra framing:
           approximately 12%.
        */

        framingScale =
            1 +
            rotationAmount * 0.12;
    }


    const finalWidth =
        drawWidth *
        framingScale;

    const finalHeight =
        drawHeight *
        framingScale;


    /*
       Draw from center.
    */

    ctx.save();


    ctx.translate(
        OUTPUT_WIDTH / 2,
        OUTPUT_HEIGHT / 2
    );


    /*
       Horizon compensation.

       The negative sign means:

       Phone rolls clockwise
       →
       image compensates counter-clockwise.
    */

    ctx.rotate(
        -outputRoll *
        Math.PI /
        180
    );


    /*
       Front camera mirror.
    */

    if(facingMode === "user"){

        ctx.scale(
            -1,
            1
        );
    }


    ctx.drawImage(
        video,

        -finalWidth / 2,
        -finalHeight / 2,

        finalWidth,
        finalHeight
    );


    ctx.restore();


    requestAnimationFrame(
        renderFrame
    );
}

/* =====================================================
   RECORDING
===================================================== */

let mediaRecorder = null;

let recordedChunks = [];

let recording = false;


function startRecording(){

    if(!cameraStarted){

        return;
    }


    recordedChunks = [];


    /*
       IMPORTANT:

       We record the processed canvas.

       So the recorded video contains
       the corrected horizon and zoom.
    */

    const processedStream =
        canvas.captureStream(30);


    /*
       Add microphone.
    */

    if(stream){

        stream
            .getAudioTracks()
            .forEach(track => {

                processedStream.addTrack(
                    track
                );

            });
    }


    const supportedTypes = [

        "video/webm;codecs=vp9,opus",

        "video/webm;codecs=vp8,opus",

        "video/webm"

    ];


    let selectedType = "";


    for(
        const type of supportedTypes
    ){

        if(
            MediaRecorder.isTypeSupported(
                type
            )
        ){

            selectedType = type;

            break;
        }
    }


    try{

        mediaRecorder =
            new MediaRecorder(
                processedStream,

                selectedType
                    ? {
                        mimeType:
                            selectedType
                    }
                    : undefined
            );


    }catch(error){

        console.error(
            "MediaRecorder error:",
            error
        );

        return;
    }


    mediaRecorder.ondataavailable =
        event => {

            if(
                event.data &&
                event.data.size > 0
            ){

                recordedChunks.push(
                    event.data
                );
            }
        };


    mediaRecorder.onstop =
        saveRecording;


    mediaRecorder.start(
        200
    );


    recording = true;


    recordButton.classList.add(
        "recording"
    );


    setStatus(
        "RECORDING",
        "recording"
    );
}


/* =====================================================
   STOP
===================================================== */

function stopRecording(){

    if(
        mediaRecorder &&
        mediaRecorder.state !==
        "inactive"
    ){

        mediaRecorder.stop();
    }


    recording = false;


    recordButton.classList.remove(
        "recording"
    );


    setStatus(
        "CAMERA READY",
        "ready"
    );
}


/* =====================================================
   SAVE
===================================================== */

function saveRecording(){

    if(
        !recordedChunks.length
    ){

        return;
    }


    const blob =
        new Blob(
            recordedChunks,
            {
                type:
                    "video/webm"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href = url;

    link.download =
        "horizon-" +
        Date.now() +
        ".webm";


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    setTimeout(() => {

        URL.revokeObjectURL(
            url
        );

    },3000);
}
