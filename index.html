<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Autonomous AI Camera Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
        }
        /* Viewfinder Container */
        .viewfinder {
            position: relative;
            flex: 1;
            width: 100%;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Top Toolbar (Flip & Zoom Only) */
        .top-toolbar {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 5;
            pointer-events: auto;
        }
        .tool-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
        .zoom-cluster {
            display: flex;
            gap: 6px;
        }
        .zoom-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        .zoom-btn.active {
            background: #ff4757;
            border-color: #ff4757;
        }
        /* Shutter Controls */
        .controls {
            height: 130px;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }
        .shutter-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #fff;
            border: 4px solid #666;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
            transition: transform 0.1s;
        }
        .shutter-btn:active {
            transform: scale(0.92);
        }
        /* Preview Modal */
        .preview-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 20;
        }
        .preview-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .preview-container img {
            max-width: 100%;
            max-height: 65vh;
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }
        .actions {
            display: flex;
            gap: 12px;
        }
        .btn {
            flex: 1;
            padding: 14px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .btn-secondary {
            background: #333;
        }
    </style>
</head>
<body>

    <!-- Camera Viewfinder -->
    <div class="viewfinder" id="viewfinder">
        <video id="cameraStream" autoplay playsinline></video>
        
        <!-- Top Tool Bar (Flip Camera & Zoom) -->
        <div class="top-toolbar">
            <button class="tool-btn" id="flipCamBtn">🔄 Flip</button>
            <div class="zoom-cluster">
                <button class="zoom-btn active" data-zoom="1">1x</button>
                <button class="zoom-btn" data-zoom="2">2x</button>
                <button class="zoom-btn" data-zoom="3">3x</button>
            </div>
        </div>
    </div>

    <!-- Shutter Controls -->
    <div class="controls">
        <button class="shutter-btn" id="captureBtn"></button>
    </div>

    <canvas id="photoCanvas" style="display:none;"></canvas>

    <!-- Preview Modal -->
    <div class="preview-modal" id="previewModal">
        <h3 id="modeTitle" style="color: #ff4757; text-align: center; margin-top: 10px;">✨ Autonomous AI Enhanced</h3>
        
        <div class="preview-container">
            <img id="resultImage" alt="Enhanced Output">
        </div>

        <div class="actions">
            <button class="btn btn-secondary" id="retakeBtn">Retake</button>
            <button class="btn" id="downloadBtn">Download Photo</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('cameraStream');
        const captureBtn = document.getElementById('captureBtn');
        const canvas = document.getElementById('photoCanvas');
        const ctx = canvas.getContext('2d');
        
        const previewModal = document.getElementById('previewModal');
        const resultImage = document.getElementById('resultImage');
        const retakeBtn = document.getElementById('retakeBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const modeTitle = document.getElementById('modeTitle');
        
        const flipCamBtn = document.getElementById('flipCamBtn');
        const zoomBtns = document.querySelectorAll('.zoom-btn');

        let currentFacingMode = 'environment';
        let currentZoom = 1;
        let currentStream = null;
        let finalDataUrl = '';

        // Initialize Camera
        async function initCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            try {
                const constraints = {
                    video: {
                        facingMode: currentFacingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };

                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
            } catch (err) {
                alert("Camera error: " + err.message);
            }
        }
        initCamera();

        flipCamBtn.addEventListener('click', () => {
            currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
            initCamera();
        });

        zoomBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                zoomBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentZoom = parseFloat(e.target.getAttribute('data-zoom'));
                video.style.transform = `scale(${currentZoom})`;
            });
        });

        // Autonomous AI Capture & Full-Frame Processing Engine
        captureBtn.addEventListener('click', () => {
            // Force strict canvas sizing based on active video stream resolution
            canvas.width = video.videoWidth || video.clientWidth || 1280;
            canvas.height = video.videoHeight || video.clientHeight || 720;
            
            // Draw the complete video frame onto the canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let data = imgData.data;

            let centerX = canvas.width / 2;
            let centerY = canvas.height / 2;
            let maxDist = Math.sqrt(centerX * centerX + centerY * centerY);

            // Autonomous pixel processing for subject highlighting and background harmony
            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    let i = (y * canvas.width + x) * 4;
                    let r = data[i], g = data[i+1], b = data[i+2];

                    let distanceFromCenter = Math.sqrt(Math.pow(x - centerX, 1.2) + Math.pow(y - centerY, 1.2));
                    let normalizedDist = distanceFromCenter / maxDist;

                    if (normalizedDist < 0.45) {
                        // Central Subject Pop & Clarity Boost
                        r = ((r / 255 - 0.5) * 1.2 + 0.5) * 255 * 1.08;
                        g = ((g / 255 - 0.5) * 1.2 + 0.5) * 255 * 1.05;
                        b = ((b / 255 - 0.5) * 1.2 + 0.5) * 255 * 1.02;
                    } else {
                        // Background Atmospheric Merge
                        let blendFactor = 1 - (normalizedDist - 0.45) * 0.7;
                        blendFactor = Math.max(0.4, Math.min(1, blendFactor));
                        
                        r = ((r / 255 - 0.5) * 1.35 + 0.5) * 255 * blendFactor;
                        g = ((g / 255 - 0.5) * 1.35 + 0.5) * 255 * blendFactor;
                        b = ((b / 255 - 0.5) * 1.35 + 0.5) * 255 * blendFactor * 1.05;
                    }

                    data[i]   = Math.min(255, Math.max(0, r));
                    data[i+1] = Math.min(255, Math.max(0, g));
                    data[i+2] = Math.min(255, Math.max(0, b));
                }
            }

            ctx.putImageData(imgData, 0, 0);

            modeTitle.innerText = "✨ AI Subject Highlight & Merge Applied";

            // Professional Watermark Stamp at the bottom
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
            ctx.fillStyle = "#111111";
            ctx.font = `bold ${Math.max(16, canvas.width / 45)}px sans-serif`;
            ctx.fillText("ASUS_I003DD", 40, canvas.height - 45);
            ctx.font = `${Math.max(14, canvas.width / 50)}px sans-serif`;
            ctx.fillText("5mm f/1.8  1/320 ISO25", canvas.width - 380, canvas.height - 45);

            finalDataUrl = canvas.toDataURL('image/jpeg', 0.95);
            resultImage.src = finalDataUrl;
            previewModal.style.display = 'flex';
        });

        retakeBtn.addEventListener('click', () => {
            previewModal.style.display = 'none';
        });

        downloadBtn.addEventListener('click', () => {
            const a = document.createElement('a');
            a.href = finalDataUrl;
            a.download = `Smart_AI_Camera_${Date.now()}.jpg`;
            a.click();
        });
    </script>
</body>
</html>
